# DỮ LIỆU MẪU (draft: true) — chỉ để chạy pipeline M6. Owner/giáo viên thay (SETUP-OWNER S10).
- id: d-b09-l1
  lesson_id: b09-l1
  lines:
    - { speaker: Phục vụ, th: "สวัสดีครับ เชิญครับ มากี่ท่านครับ", vi: "Xin chào, mời vào! Quý khách đi mấy người ạ?" }
    - { speaker: Khách, th: "สองคนค่ะ ขอเมนูหน่อยค่ะ", vi: "Hai người ạ. Cho tôi xin thực đơn." }
    - { speaker: Phục vụ, th: "นี่เมนูครับ จะรับอะไรดีครับ", vi: "Thực đơn đây ạ. Quý khách dùng gì ạ?" }
    - { speaker: Khách, th: "ขอผัดไทยหนึ่งจาน กับต้มยำกุ้งหนึ่งถ้วยค่ะ", vi: "Cho tôi một đĩa pad Thái và một bát tom yum tôm." }
    - { speaker: Phục vụ, th: "ต้มยำกุ้งเผ็ดนะครับ กินเผ็ดได้ไหมครับ", vi: "Tom yum tôm cay đấy ạ. Quý khách ăn cay được không?" }
    - { speaker: Khách, th: "กินเผ็ดไม่ได้ค่ะ ขอไม่เผ็ดนะคะ", vi: "Tôi không ăn cay được. Làm không cay giúp tôi nhé." }
    - { speaker: Phục vụ, th: "ได้ครับ รับข้าวเปล่าด้วยไหมครับ", vi: "Vâng ạ. Quý khách có lấy thêm cơm trắng không ạ?" }
    - { speaker: Khách, th: "เอาข้าวเปล่าสองจานค่ะ ขอบคุณค่ะ", vi: "Cho hai đĩa cơm trắng. Cảm ơn anh." }
  source: claude-tc3-b09
  draft: true
- id: d-b09-l10
  lesson_id: b09-l10
  lines:
    - { speaker: Phục vụ, th: "จะรับเครื่องดื่มอะไรดีครับ", vi: "Quý khách dùng đồ uống gì ạ?" }
    - { speaker: Khách, th: "ขอชาเย็นหนึ่งแก้ว กับน้ำเปล่าหนึ่งขวดค่ะ", vi: "Cho tôi một cốc trà sữa Thái và một chai nước lọc." }
    - { speaker: Khách, th: "น้องคะ เก็บเงินด้วยค่ะ", vi: "(Ăn xong) Em ơi, tính tiền giúp chị." }
    - { speaker: Phục vụ, th: "ทั้งหมดสามร้อยห้าสิบบาทครับ", vi: "Tất cả 350 baht ạ." }
    - { speaker: Khách, th: "จ่ายด้วยบัตรได้ไหมคะ", vi: "Trả bằng thẻ được không em?" }
    - { speaker: Phục vụ, th: "ขอโทษครับ ร้านเรารับแต่เงินสดครับ", vi: "Xin lỗi chị, quán em chỉ nhận tiền mặt ạ." }
    - { speaker: Khách, th: "ได้ค่ะ นี่ห้าร้อยบาทค่ะ", vi: "Được rồi. Đây là 500 baht." }
    - { speaker: Phục vụ, th: "นี่เงินทอนหนึ่งร้อยห้าสิบบาทครับ ขอบคุณครับ", vi: "Đây là 150 baht tiền thối ạ. Cảm ơn chị." }
  source: claude-tc3-b09
  draft: true
- id: d-b12-l1
  lesson_id: b12-l1
  lines:
    - { speaker: A, th: "ขอโทษครับ ตอนนี้กี่โมงแล้วครับ", vi: "Xin lỗi! Bây giờ mấy giờ rồi ạ?" }
    - { speaker: B, th: "แปดโมงสิบห้าแล้วค่ะ", vi: "8h15 sáng rồi ạ." }
    - { speaker: A, th: "ผมไปก่อนดีกว่า กลัวว่าจะสายครับ", vi: "Tôi đi trước tốt hơn, tôi e là sẽ muộn nhé." }
    - { speaker: B, th: "คุณไปรถเมล์เหรอคะ", vi: "Bạn đi xe buýt hả?" }
    - { speaker: A, th: "ไม่ใช่ครับ ผมขับรถไปเองครับ", vi: "Không phải ạ. Tôi tự lái xe đi ạ." }
    - { speaker: B, th: "งานเริ่มกี่โมงคะ", vi: "Chương trình bắt đầu lúc mấy giờ?" }
    - { speaker: A, th: "เริ่มสิบโมงเช้าครับ", vi: "Bắt đầu lúc 10h sáng ạ." }
    - { speaker: B, th: "แล้วงานช่วงบ่ายล่ะคะ", vi: "Còn chương trình trong khoảng thời gian chiều thì sao?" }
    - { speaker: A, th: "เริ่มหกโมงเย็นครับ แต่บางครั้งก็หกโมงครึ่ง ผมไม่ค่อยแน่ใจครับ", vi: "Bắt đầu 6h chiều ạ. Nhưng thỉnh thoảng thì 6h30. Tôi không chắc chắn lắm đâu." }
    - { speaker: B, th: "ขอบคุณมากค่ะ", vi: "Cảm ơn nhiều ạ!" }
  source: plernpin-b12#p3-5
  draft: true
- id: d-b12-l2
  lesson_id: b12-l2
  lines:
    - { speaker: A, th: "สวัสดีครับคุณผู้หญิง", vi: "Xin chào bà!" }
    - { speaker: B, th: "สวัสดีค่ะ ฉันต้องการห้องเตียงใหญ่หนึ่งห้อง และห้องเตียงคู่หนึ่งห้องค่ะ", vi: "Xin chào. Tôi muốn 1 phòng giường đôi và 1 phòng 2 giường ạ." }
    - { speaker: A, th: "ยังมีห้องว่างอยู่ครับ", vi: "Phòng vẫn còn đang trống ạ." }
    - { speaker: B, th: "ราคาห้องละเท่าไรคะ", vi: "Giá mỗi phòng bao nhiêu ạ?" }
    - { speaker: A, th: "ห้องละสองพันบาทต่อวันครับ", vi: "Mỗi phòng 2,000 bạt/ngày ạ." }
    - { speaker: B, th: "ขอห้องที่ติดกันและอยู่ชั้นเดียวกันนะคะ", vi: "Tôi xin phòng liền nhau và cùng tầng với nhau ạ." }
    - { speaker: A, th: "คุณจะพักกี่วันครับ", vi: "Bà sẽ ở mấy ngày ạ?" }
    - { speaker: B, th: "ฉันพักสองวันค่ะ", vi: "Tôi ở 2 ngày ạ." }
  source: plernpin-b12#p6-7
  draft: true
- id: d-b12-l3
  lesson_id: b12-l3
  lines:
    - { speaker: A, th: "ขอพาสปอร์ตและเงินมัดจำหนึ่งพันบาทครับ นี่กุญแจห้องกับคูปองอาหารเช้าครับ ห้องอาหารอยู่ชั้นล่าง ไวไฟฟรี รหัสผ่านคือหนึ่งถึงเก้าครับ", vi: "Xin hộ chiếu và tiền đặt cọc 1,000 bạt ạ. Chìa khóa phòng, phiếu ăn sáng, phòng ăn ở tầng trệt, wifi free, password từ 1 đến 9 ạ." }
    - { speaker: B, th: "ถ้าจะโทรหาพนักงานต้อนรับ ต้องกดเบอร์อะไรคะ", vi: "Gọi nhân viên lễ tân bấm số nào ạ?" }
    - { speaker: A, th: "กดเบอร์หนึ่งร้อยครับ", vi: "Bấm số 100 ạ." }
    - { speaker: B, th: "เช็คเอาท์กี่โมงคะ", vi: "Trả phòng lúc mấy giờ ạ?" }
    - { speaker: A, th: "เช็คเอาท์ตอนเที่ยงครับ", vi: "12h trưa trả phòng ạ." }
    - { speaker: B, th: "ช่วยปลุกตอนหกโมงเช้าด้วยนะคะ", vi: "Giúp báo thức lúc 6h sáng nhé ạ." }
    - { speaker: A, th: "ได้ครับ", vi: "Dạ vâng ạ." }
    - { speaker: B, th: "ช่วยยกกระเป๋าขึ้นไปห้องสองศูนย์ห้าให้หน่อยนะคะ", vi: "Bạn chuyển hành lý lên phòng 205 giúp tôi nhé ạ." }
    - { speaker: A, th: "ได้ครับ", vi: "Dạ vâng ạ." }
    - { speaker: B, th: "นี่ทิปสำหรับคุณค่ะ", vi: "Đây là tiền bo cho anh." }
    - { speaker: A, th: "ขอบคุณครับ", vi: "Cảm ơn bà ạ." }
    - { speaker: B, th: "ไม่เป็นไรค่ะ", vi: "Không có gì!" }
  source: plernpin-b12#p8-10
  draft: true
- id: d-b12-l4
  lesson_id: b12-l4
  lines:
    - { speaker: A, th: "ฮวา วันอาทิตย์นี้คุณจะทำอะไรบ้างครับ", vi: "Bạn Hoa, chủ nhật này bạn định làm những gì?" }
    - { speaker: B, th: "ฉันยังไม่แน่ใจค่ะ อยากไปอยุธยาค่ะ", vi: "Tôi vẫn chưa chắc chắn ạ. Tôi muốn đi Ayutthaya nhé." }
    - { speaker: A, th: "อยุธยาสวยมากเลยครับ แล้วคุณจะไปเที่ยวสุโขทัยไหมครับ", vi: "Ayutthaya đẹp lắm luôn ạ. Thế bạn định đi vương quốc Sukhothai không?" }
    - { speaker: B, th: "อาจจะค่ะ ฉันอยากไปหลายที่มากเลยค่ะ", vi: "Có thể ạ, tôi muốn đi nhiều lắm luôn." }
    - { speaker: A, th: "แล้วเชียงใหม่ล่ะครับ", vi: "Còn Chiangmai thì sao?" }
    - { speaker: B, th: "อาจจะไปค่ะ แต่ยังไม่รู้ ฉันอยากไปทะเลด้วยค่ะ", vi: "Có thể đi ạ. Nhưng chưa biết. Tôi muốn đi bãi biển nữa nhé." }
    - { speaker: A, th: "งั้นไปภูเก็ตกับกระบี่สิครับ", vi: "Vậy thì đi Phuket và Krabi ạ." }
    - { speaker: B, th: "โอเคค่ะ", vi: "Okie ạ." }
  source: plernpin-b12#p11-12
  draft: true
- id: d-b12-l5
  lesson_id: b12-l5
  lines:
    - { speaker: A, th: "วันนี้อากาศไม่ดีครับ แต่คุณโชคดีนะครับ หน้าร้อนเป็นฤดูที่สวย อากาศดีมากเลยในเดือนเมษายนครับ", vi: "Ngày hôm nay thời tiết tồi. Nhưng bạn may mắn nhé. Mùa hè là mùa đẹp ạ, thời tiết đẹp lắm luôn trong tháng 4." }
    - { speaker: B, th: "จริงเหรอคะ", vi: "Thật hả?" }
    - { speaker: A, th: "ใช่ครับ อากาศดีมาก", vi: "Vâng, thời tiết đẹp lắm." }
    - { speaker: B, th: "ขอบคุณค่ะ รถแท็กซี่อยู่ที่ไหนคะ", vi: "Cảm ơn, xe taxi ở đâu ạ?" }
    - { speaker: A, th: "รถแท็กซี่อยู่หน้าโรงแรมครับ", vi: "Xe taxi ở trước khách sạn ạ." }
    - { speaker: B, th: "โอเคค่ะ", vi: "Oki ạ." }
    - { speaker: A, th: "เที่ยวให้สนุกนะครับ", vi: "Du lịch thú vị nhé!" }
    - { speaker: B, th: "ขอบคุณค่ะ", vi: "Cảm ơn ạ!" }
  source: plernpin-b12#p13-14
  draft: true
- id: d-b12-l6
  lesson_id: b12-l6
  lines:
    - { speaker: A, th: "สวัสดีครับ ผมอยากจองห้อง มีห้องว่างไหมครับ", vi: "Xin chào, tôi muốn đặt phòng, có phòng trống không ạ?" }
    - { speaker: B, th: "มีค่ะ มีทั้งห้องเดี่ยวและห้องคู่ค่ะ", vi: "Dạ có ạ. Có cả phòng đơn lẫn phòng đôi ạ." }
    - { speaker: A, th: "ผมขอดูห้องได้ไหมครับ", vi: "Tôi xem phòng được không ạ?" }
    - { speaker: B, th: "ได้ค่ะ", vi: "Dạ, được ạ." }
    - { speaker: A, th: "มีห้องอื่นไหมครับ", vi: "Có phòng khác không ạ?" }
    - { speaker: B, th: "มีค่ะ", vi: "Dạ có ạ." }
    - { speaker: A, th: "มีห้องที่ใหญ่กว่านี้ไหมครับ", vi: "Có phòng to hơn này không ạ?" }
    - { speaker: B, th: "มีค่ะ", vi: "Có ạ." }
    - { speaker: A, th: "โอเค ห้องนี้ดีกว่าเยอะเลยครับ งั้นผมเอาห้องนี้นะครับ", vi: "Oki, phòng này tốt hơn nhiều luôn ạ. Vậy tôi chốt lấy phòng này nhé." }
    - { speaker: B, th: "โอเคค่ะ", vi: "Oki ạ." }
  source: plernpin-b12#p15-17
  draft: true
- id: d-b12-l7
  lesson_id: b12-l7
  lines:
    - { speaker: A, th: "ผมจะพักสองคืน ลดราคาได้ไหมครับ", vi: "Tôi sẽ nghỉ 2 đêm, giảm giá được không ạ?" }
    - { speaker: B, th: "ลดไม่ได้ค่ะ", vi: "Không giảm được ạ." }
    - { speaker: A, th: "แล้วห้องของผมราคาเท่าไรครับ", vi: "Vậy phòng của tôi giá bao nhiêu?" }
    - { speaker: B, th: "ค่าห้องคืนละห้าร้อยบาทค่ะ", vi: "Giá phòng mỗi đêm 500 bạt ạ." }
    - { speaker: A, th: "โอเคครับ ห้องมีแอร์ใช่ไหมครับ", vi: "Oki ạ. Phòng có điều hòa phải không ạ?" }
    - { speaker: B, th: "มีค่ะ", vi: "Dạ có ạ." }
    - { speaker: A, th: "มีเครื่องทำน้ำอุ่นไหมครับ", vi: "Có bình nóng lạnh không ạ?" }
    - { speaker: B, th: "มีด้วยค่ะ", vi: "Có luôn ạ." }
    - { speaker: A, th: "ดีมากเลยครับ", vi: "Tốt quá ạ." }
    - { speaker: B, th: "นี่กุญแจค่ะ ห้องของคุณเบอร์สามห้าเจ็ดค่ะ", vi: "Chìa khóa đây ạ, phòng của anh số 357 ạ." }
    - { speaker: A, th: "ขอบคุณครับ แล้วที่นี่มีอาหารเช้าไหมครับ", vi: "Dạ, cảm ơn ạ. Thế ở đây có phục vụ bữa ăn sáng không?" }
    - { speaker: B, th: "มีค่ะ อาหารเช้าเริ่มตั้งแต่เจ็ดโมงเช้าถึงเก้าโมงเช้าที่ชั้นสามค่ะ", vi: "Dạ có ạ. Bữa ăn sáng sẽ bắt đầu từ 7h sáng đến 9h sáng ở tầng 3 ạ." }
    - { speaker: A, th: "ขอบคุณมากนะครับ", vi: "Cảm ơn bạn nhiều nhé." }
    - { speaker: B, th: "ไม่เป็นไรค่ะ", vi: "Dạ không có gì ạ." }
  source: plernpin-b12#p18-21
  draft: true
- id: d-b11-l1
  lesson_id: b11-l1
  lines:
    - { speaker: A, th: "สวัสดีครับ", vi: "Xin chào" }
    - { speaker: B, th: "สวัสดีค่ะ", vi: "Xin chào" }
    - { speaker: A, th: "คุณชื่ออะไรครับ", vi: "Bạn tên là gì?" }
    - { speaker: B, th: "ฉันชื่อลานค่ะ แล้วคุณชื่ออะไรคะ", vi: "Tôi tên Lan. Còn bạn tên gì?" }
    - { speaker: A, th: "ผมชื่อนามครับ แล้วคุณนามสกุลอะไรครับ", vi: "Tôi tên Nam. Thế họ của bạn là gì?" }
    - { speaker: B, th: "ฉันนามสกุลเหงียนค่ะ แล้วคุณล่ะคะ", vi: "Tôi họ Nguyễn ạ. Còn bạn?" }
    - { speaker: A, th: "ผมนามสกุลเจิ่นครับ คุณเป็นคนจังหวัดอะไรครับ", vi: "Tôi họ Trần ạ. Bạn là người tỉnh nào?" }
    - { speaker: B, th: "ฉันเป็นคนจังหวัดบั๊กนิญค่ะ แล้วคุณล่ะคะ", vi: "Tôi là người tỉnh Bắc Ninh. Còn bạn?" }
    - { speaker: A, th: "ผมเป็นคนจังหวัดไฮฟองครับ คุณอายุเท่าไรครับ", vi: "Tôi là người tỉnh Hải Phòng. Bạn bao nhiêu tuổi?" }
    - { speaker: B, th: "ฉันอายุยี่สิบปีค่ะ แล้วคุณล่ะคะ", vi: "Tôi 20 tuổi, còn bạn?" }
    - { speaker: A, th: "เหมือนกันเลยครับ", vi: "Giống hệt nhau luôn." }
  source: plernpin-b11#p3-5
  draft: true
- id: d-b11-l2
  lesson_id: b11-l2
  lines:
    - { speaker: B, th: "ฉันชอบภาษาไทยมากค่ะ คุณสนใจเรียนภาษาไทยไหมคะ", vi: "Tôi thích tiếng Thái lắm, bạn có hứng thú học tiếng Thái không?" }
    - { speaker: A, th: "สนใจครับ ตอนนี้ผมกำลังเรียนอยู่ครับ", vi: "Hứng thú ạ. Hiện tại tôi đang học đó." }
    - { speaker: B, th: "คุณพูดได้เยอะหรือยังคะ", vi: "Bạn nói được nhiều chưa?" }
    - { speaker: A, th: "พูดได้นิดหน่อยครับ ยังเรียนอยู่ครับ แล้วคุณล่ะครับ", vi: "Nói được một chút ạ. Vẫn đang học ạ. Còn bạn?" }
    - { speaker: B, th: "ฉันเรียนภาษาไทยมาสองปีแล้วค่ะ ฉันพูดภาษาไทยได้ดีค่ะ", vi: "Tôi học tiếng Thái được 2 năm rồi. Tôi nói tiếng Thái được tốt ạ." }
    - { speaker: A, th: "คุณเก่งมากครับ", vi: "Bạn giỏi quá" }
    - { speaker: B, th: "ขอบคุณมากค่ะ", vi: "Cảm ơn bạn nhiều." }
    - { speaker: A, th: "ขอโทษครับ ผมมีธุระต้องไปก่อน ลาก่อนครับ", vi: "Xin lỗi, tôi có việc phải đi trước. Tạm biệt bạn." }
    - { speaker: B, th: "โอเคค่ะ โอกาสหน้าเจอกันใหม่นะคะ", vi: "Okie. Dịp sau gặp lại nhé!" }
  source: plernpin-b11#p5-7
  draft: true
- id: d-b11-l3
  lesson_id: b11-l3
  lines:
    - { speaker: A, th: "พี่ฮวากำลังจะไปไหนครับ", vi: "Chị Hoa đang đi đâu đấy?" }
    - { speaker: B, th: "สวัสดีจ้ะน้อง พี่กำลังจะไปสนามบินค่ะ", vi: "Chào em, chị đang đi sân bay." }
    - { speaker: A, th: "พี่จะไปไหนครับ", vi: "Chị đi đâu ạ?" }
    - { speaker: B, th: "พี่ไปกรุงเทพค่ะ", vi: "Chị đi BangKok." }
    - { speaker: A, th: "พี่ไปเที่ยวใช่ไหมครับ", vi: "Chị đi du lịch phải không ạ?" }
    - { speaker: B, th: "ไม่ใช่จ้ะ พี่ไปทำงานจ้ะน้อง", vi: "Không. Chị đi công tác em ạ." }
    - { speaker: A, th: "พี่ไปนานเท่าไรครับ", vi: "Chị đi bao lâu?" }
    - { speaker: B, th: "พี่ไปสามวันค่ะ แล้วน้องจะไปไหนคะ", vi: "Chị đi 3 ngày. Còn em, đi đâu đấy?" }
    - { speaker: A, th: "ผมไปประชุมครับพี่", vi: "Em đi họp chị ạ." }
    - { speaker: B, th: "น้องประชุมที่ไหนคะ", vi: "Em họp ở đâu?" }
    - { speaker: A, th: "ผมประชุมที่โรงแรมเอบีซีครับพี่", vi: "Em họp ở khách sạn ABC chị ạ." }
    - { speaker: B, th: "พี่ไปก่อนนะ อาทิตย์หน้าเจอกันนะคะ", vi: "Chị đi nhé, tuần sau gặp em sau nhé." }
    - { speaker: A, th: "ครับ สวัสดีครับพี่ อาทิตย์หน้าเจอกันครับ", vi: "Vâng ạ. Em chào chị. Tuần sau gặp chị ạ." }
    - { speaker: B, th: "บ๊ายบายจ้ะน้อง", vi: "Bye em." }
  source: plernpin-b11#p8-11
  draft: true
- id: d-b11-l4
  lesson_id: b11-l4
  lines:
    - { speaker: A, th: "พรุ่งนี้คุณว่างไหมครับ ไปห้องสมุดด้วยกันไหมครับ", vi: "Ngày mai bạn rảnh không? đi thư viện cùng nhau không ạ?" }
    - { speaker: B, th: "ขอโทษค่ะ พรุ่งนี้ฉันไม่ว่างค่ะ ฉันนัดกับเพื่อนไปบางแสนแล้วค่ะ", vi: "Mình xin lỗi, ngày mai mình không rảnh ạ, mình có hẹn với bạn đi Bang Xẻn rồi ạ." }
    - { speaker: A, th: "ไม่เป็นไรครับ วันอื่นก็ได้ครับ", vi: "Không sao, ngày khác cũng được ạ" }
    - { speaker: B, th: "โอเคค่ะ", vi: "Okie ạ." }
  source: plernpin-b11#p12
  draft: true
- id: d-b11-l5
  lesson_id: b11-l5
  lines:
    - { speaker: A, th: "นี่คือวัดอะไรครับ สวยมากเลยครับ", vi: "Đây là chùa gì vậy ạ? đẹp quá ạ" }
    - { speaker: B, th: "นี่คือวัดพระแก้วค่ะ เป็นวัดที่มีชื่อเสียงที่สุดในกรุงเทพค่ะ", vi: "Đây là chùa phật ngọc, là ngôi chùa nổi tiếng nhất ở Bangkok ạ" }
    - { speaker: A, th: "อย่างนั้นเหรอครับ พรุ่งนี้ช่วยพาผมไปวัดพระแก้วได้ไหมครับ", vi: "Thế à, ngày mai giúp dẫn mình đi chùa phật ngọc được ko?" }
    - { speaker: B, th: "ได้สิคะ เราชวนพี่นามไปด้วยก็ได้ค่ะ", vi: "Được chứ, chúng ta có thể rủ anh Nam đi cùng ạ" }
  source: plernpin-b11#p13
  draft: true
- id: d-b11-l6
  lesson_id: b11-l6
  lines:
    - { speaker: A, th: "คนไทยไม่ต้องซื้อตั๋วเข้าประตูใช่ไหมครับ", vi: "Người Thái không phải mua vé qua cổng đúng không ạ?" }
    - { speaker: B, th: "ใช่ค่ะ คนไทยเข้าฟรีค่ะ", vi: "Đúng ạ, người Thái vào miễn phí ạ" }
    - { speaker: A, th: "แล้วคุณเคยไปเที่ยวตลาดน้ำที่ไทยหรือยังครับ", vi: "Thế bạn đã đi chơi chợ nổi ở Thái bao giờ chưa ạ?" }
    - { speaker: B, th: "ฉันยังไม่เคยไปเลยค่ะ", vi: "Mình chưa đi bao giờ ạ" }
    - { speaker: A, th: "งั้นวันนี้ผมจะพาคุณไปเที่ยวตลาดน้ำของไทยนะครับ", vi: "Vậy hôm nay mình sẽ đưa bạn đi thăm chợ nổi ở Thái nhé!" }
    - { speaker: B, th: "ได้ค่ะ เราจะขับรถไปเองหรือเรียกรถคะ", vi: "Được ạ, chúng ta tự lái xe hay đi xe ngoài ạ" }
    - { speaker: A, th: "เราขับรถไปเองดีกว่าครับ เพราะตลาดน้ำอยู่ไม่ไกลมากครับ", vi: "Chúng ta tự lái xe đi thì tốt hơn ạ vì chợ nổi ở không quá xa" }
    - { speaker: B, th: "โอเคค่ะ", vi: "Okie ạ" }
    - { speaker: A, th: "ถึงตลาดน้ำแล้วครับ", vi: "Đến chợ nổi rồi ạ" }
    - { speaker: B, th: "โอ้ ตลาดคึกคักมากเลยค่ะ", vi: "Ồ, chợ đông vui quá ạ" }
    - { speaker: A, th: "ใช่ครับ ที่นี่มีทั้งอาหาร ของใช้ และของที่ระลึกหลากหลายมากให้นักท่องเที่ยวเลือกซื้อครับ", vi: "Đúng ạ, ở đây có đồ ăn, đồ dùng và đồ lưu niệm rất đa dạng cho khách du lịch chọn mua ạ" }
    - { speaker: B, th: "งั้นเราเข้าไปดูกันเถอะค่ะ", vi: "Vậy chúng ta vào xem thôi ạ" }
  source: plernpin-b11#p14-16
  draft: true
- id: d-b11-l7
  lesson_id: b11-l7
  lines:
    - { speaker: A, th: "ขอโทษครับ", vi: "Xin lỗi!" }
    - { speaker: B, th: "มีอะไรคะ", vi: "Gì thế ạ?" }
    - { speaker: A, th: "ผมจะไปธนาคาร ไปทางไหนครับ", vi: "Tôi định đi ngân hàng, đi lối nào ạ?" }
    - { speaker: B, th: "ตรงไปค่ะ ถึงปากซอยแล้วเลี้ยวซ้าย ธนาคารอยู่ข้างร้านกาแฟค่ะ", vi: "Đi thẳng đi, đến đầu ngõ rồi rẽ trái. Ngân hàng ở cạnh quán cà phê" }
    - { speaker: A, th: "ต้องเดินไกลไหมครับ", vi: "Phải đi bộ xa không ạ?" }
    - { speaker: B, th: "ไม่ไกลค่ะ เดินประมาณห้านาทีก็ถึงค่ะ", vi: "Không xa. Đi bộ khoảng 5 phút thì sẽ đến" }
    - { speaker: A, th: "ขอบคุณมากครับ", vi: "Cảm ơn nhiều ạ!" }
    - { speaker: B, th: "ไม่เป็นไรค่ะ", vi: "Không có gì!" }
  source: plernpin-b11#p17-18
  draft: true
- id: d-b11-l8
  lesson_id: b11-l8
  lines:
    - { speaker: A, th: "รถเมล์สายอะไรไปอนุสาวรีย์ชัยสมรภูมิครับ", vi: "Xe buýt tuyến gì đi đến Đài Tưởng Niệm Chiến Thắng?" }
    - { speaker: B, th: "สายห้าสิบเก้าค่ะ เป็นรถแอร์ค่ะ", vi: "Tuyến 59 ạ, là xe điều hòa" }
    - { speaker: A, th: "ขึ้นที่ไหนครับ", vi: "Lên ở đâu?" }
    - { speaker: B, th: "ขึ้นที่ป้ายหน้าเซเว่นค่ะ", vi: "Lên ở trạm trước 7/11" }
    - { speaker: A, th: "ขอบคุณครับ แล้วผมต้องลงที่ไหนครับ", vi: "Cảm ơn ạ! Thế tôi phải xuống ở đâu?" }
    - { speaker: B, th: "ลงที่ป้ายอนุสาวรีย์ชัยสมรภูมิค่ะ คนลงเยอะ สังเกตง่ายมากค่ะ", vi: "Xuống ở trạm Đài Tưởng Niệm Chiến Thắng ạ. Người xuống nhiều. Dễ nhận ra lắm ạ" }
    - { speaker: A, th: "ค่ารถเท่าไรครับ", vi: "Phí đi lại bao nhiêu ạ?" }
    - { speaker: B, th: "สิบบาทค่ะ", vi: "10 bạt ạ." }
    - { speaker: A, th: "ขอบคุณมากครับ", vi: "Cảm ơn nhiều ạ." }
    - { speaker: B, th: "ไม่เป็นไรค่ะ", vi: "Không có gì ạ!" }
  source: plernpin-b11#p19-21
  draft: true
- id: d-b10-quan-ao
  lesson_id: b10-l10
  lines:
    - { speaker: A, th: "ขอโทษค่ะ เสื้อตัวนี้ราคาเท่าไรคะ", vi: "Xin lỗi, cái áo này giá bao nhiêu ạ?" }
    - { speaker: B, th: "ตัวละสามร้อยห้าสิบบาทครับ", vi: "350 bạt một cái ạ." }
    - { speaker: A, th: "มีไซส์ใหญ่กว่านี้ไหมคะ", vi: "Có cỡ lớn hơn cái này không ạ?" }
    - { speaker: B, th: "มีครับ ไซส์แอลครับ", vi: "Có ạ, cỡ L ạ." }
    - { speaker: A, th: "ขอลองได้ไหมคะ ห้องลองอยู่ที่ไหนคะ", vi: "Tôi mặc thử được không? Phòng thử đồ ở đâu ạ?" }
    - { speaker: B, th: "ได้ครับ ห้องลองอยู่ทางขวามือครับ", vi: "Được ạ, phòng thử đồ ở bên tay phải ạ." }
    - { speaker: A, th: "ใส่สบายดีค่ะ แต่แพงไปหน่อย ลดได้ไหมคะ", vi: "Mặc thoải mái lắm, nhưng hơi đắt. Giảm giá được không ạ?" }
    - { speaker: B, th: "ลดให้เหลือสามร้อยบาทครับ", vi: "Tôi giảm cho chị còn 300 bạt ạ." }
  source: claude-b10
  draft: true
- id: d-b10-cho-trai-cay
  lesson_id: b10-l3
  lines:
    - { speaker: A, th: "แม่ค้าครับ มะม่วงกิโลละเท่าไรครับ", vi: "Chị bán hàng ơi, xoài mỗi cân bao nhiêu ạ?" }
    - { speaker: B, th: "กิโลละแปดสิบบาทค่ะ หวานมากนะคะ", vi: "80 bạt một cân ạ. Ngọt lắm đấy." }
    - { speaker: A, th: "แพงจัง ลดได้ไหมครับ", vi: "Đắt quá, giảm được không ạ?" }
    - { speaker: B, th: "ถ้าซื้อสองกิโล ให้กิโลละเจ็ดสิบบาทค่ะ", vi: "Nếu mua 2 cân thì tôi để 70 bạt một cân." }
    - { speaker: A, th: "ตกลงครับ เอาสองกิโล แล้วกล้วยหวีละเท่าไรครับ", vi: "Đồng ý, tôi lấy 2 cân. Còn chuối mỗi nải bao nhiêu ạ?" }
    - { speaker: B, th: "หวีละสี่สิบบาทค่ะ", vi: "40 bạt một nải ạ." }
    - { speaker: A, th: "เอากล้วยหนึ่งหวีด้วยครับ ทั้งหมดเท่าไรครับ", vi: "Lấy thêm một nải chuối nữa. Tất cả bao nhiêu ạ?" }
    - { speaker: B, th: "ทั้งหมดหนึ่งร้อยแปดสิบบาทค่ะ", vi: "Tất cả 180 bạt ạ." }
  source: claude-b10
  draft: true
- id: d-b10-cho-thit-ca
  lesson_id: b10-l5
  lines:
    - { speaker: A, th: "กุ้งสดไหมคะ", vi: "Tôm có tươi không ạ?" }
    - { speaker: B, th: "สดครับ เพิ่งมาเมื่อเช้าครับ", vi: "Tươi ạ, vừa mới về sáng nay." }
    - { speaker: A, th: "กุ้งกิโลละเท่าไรคะ", vi: "Tôm mỗi cân bao nhiêu ạ?" }
    - { speaker: B, th: "กิโลละสามร้อยบาทครับ", vi: "300 bạt một cân ạ." }
    - { speaker: A, th: "ขอกุ้งครึ่งกิโล แล้วก็เนื้อหมูหนึ่งกิโลค่ะ", vi: "Cho tôi nửa cân tôm và một cân thịt lợn." }
    - { speaker: B, th: "เนื้อหมูกิโลละหนึ่งร้อยแปดสิบบาท ทั้งหมดสามร้อยสามสิบบาทครับ", vi: "Thịt lợn 180 bạt một cân, tất cả 330 bạt ạ." }
    - { speaker: A, th: "ลดให้หน่อยได้ไหมคะ", vi: "Bớt cho tôi một chút được không ạ?" }
    - { speaker: B, th: "ได้ครับ สามร้อยบาทพอครับ", vi: "Được ạ, 300 bạt thôi." }
  source: claude-b10
  draft: true
- id: d-b10-sieu-thi
  lesson_id: b10-l11
  lines:
    - { speaker: A, th: "ทั้งหมดหกร้อยห้าสิบบาทครับ", vi: "Tất cả 650 bạt ạ." }
    - { speaker: B, th: "จ่ายด้วยบัตรเครดิตได้ไหมคะ", vi: "Trả bằng thẻ tín dụng được không ạ?" }
    - { speaker: A, th: "ได้ครับ รับถุงไหมครับ", vi: "Được ạ. Chị có lấy túi không ạ?" }
    - { speaker: B, th: "ไม่ต้องค่ะ ฉันมีถุงช็อปปิ้งแล้ว ที่นี่ส่งถึงบ้านไหมคะ", vi: "Không cần ạ, tôi có túi mua sắm rồi. Ở đây có giao tận nhà không ạ?" }
    - { speaker: A, th: "ส่งครับ ถ้าซื้อเกินห้าร้อยบาท ส่งฟรีครับ", vi: "Có ạ. Mua trên 500 bạt thì giao miễn phí ạ." }
    - { speaker: B, th: "ดีจังเลยค่ะ ช่วยส่งพรุ่งนี้เช้าได้ไหมคะ", vi: "Tốt quá. Giao giúp tôi sáng mai được không ạ?" }
    - { speaker: A, th: "ได้ครับ นี่ใบเสร็จครับ ขอบคุณครับ", vi: "Được ạ. Hóa đơn của chị đây ạ. Cảm ơn chị." }
    - { speaker: B, th: "ขอบคุณค่ะ", vi: "Cảm ơn anh." }
  source: claude-b10
  draft: true
- id: d-b08-dat-phong
  lesson_id: b08-l6
  lines:
    - { speaker: Khách, th: "สวัสดีครับ คืนนี้มีห้องว่างไหมครับ", vi: "Xin chào, tối nay còn phòng trống không ạ?" }
    - { speaker: Lễ tân, th: "มีค่ะ คุณอยากได้ห้องแบบไหนคะ", vi: "Còn ạ. Anh muốn phòng loại nào ạ?" }
    - { speaker: Khách, th: "ผมอยากได้ห้องเตียงเดี่ยวที่มีระเบียงครับ ค่าห้องคืนละเท่าไรครับ", vi: "Tôi muốn phòng giường đơn có ban công. Giá phòng mỗi đêm bao nhiêu ạ?" }
    - { speaker: Lễ tân, th: "คืนละหนึ่งพันสองร้อยบาท รวมอาหารเช้าค่ะ จะพักกี่คืนคะ", vi: "1.200 baht một đêm, gồm bữa sáng ạ. Anh sẽ ở mấy đêm ạ?" }
    - { speaker: Khách, th: "สองคืนครับ จ่ายด้วยบัตรเครดิตได้ไหมครับ", vi: "Hai đêm ạ. Trả bằng thẻ tín dụng được không ạ?" }
    - { speaker: Lễ tân, th: "ได้ค่ะ ขอดูหนังสือเดินทางหน่อยค่ะ แล้วกรุณาเซ็นชื่อตรงนี้ค่ะ", vi: "Được ạ. Cho tôi xem hộ chiếu một chút, rồi làm ơn ký tên ở đây ạ." }
    - { speaker: Khách, th: "นี่ครับ ห้องอาหารอยู่ชั้นไหนครับ", vi: "Đây ạ. Nhà hàng ở tầng mấy ạ?" }
    - { speaker: Lễ tân, th: "ชั้นสองค่ะ นี่กุญแจห้องกับคูปองอาหารเช้าค่ะ ลิฟท์อยู่ตรงนั้นค่ะ", vi: "Ở tầng hai ạ. Đây là chìa khóa phòng và phiếu ăn sáng. Thang máy ở ngay chỗ đó ạ." }
  source: claude-b08
  draft: true
- id: d-b08-tra-phong
  lesson_id: b08-l8
  lines:
    - { speaker: Khách, th: "สวัสดีครับ ผมอยู่ห้องห้าศูนย์ห้าครับ", vi: "Xin chào, tôi ở phòng 505." }
    - { speaker: Lễ tân, th: "สวัสดีค่ะ มีอะไรให้ช่วยไหมคะ", vi: "Chào anh, tôi có thể giúp gì ạ?" }
    - { speaker: Khách, th: "ผมอยากขอผ้าเช็ดตัวกับหมอนเพิ่มครับ แล้วกรุณาทำความสะอาดห้องให้ด้วยครับ", vi: "Tôi muốn xin thêm khăn tắm và gối. Và làm ơn dọn phòng giúp tôi." }
    - { speaker: Lễ tân, th: "ได้ค่ะ เดี๋ยวพนักงานจะเอาขึ้นไปให้ค่ะ", vi: "Vâng ạ, nhân viên sẽ mang lên cho anh ngay ạ." }
    - { speaker: Khách, th: "ผมจะเช็คเอาท์ครับ นี่กุญแจห้องครับ", vi: "(Sáng hôm sau) Tôi muốn trả phòng. Đây là chìa khóa phòng." }
    - { speaker: Lễ tân, th: "นี่ใบเรียกเก็บเงินค่ะ ทั้งหมดสองพันสี่ร้อยบาทค่ะ", vi: "Đây là hóa đơn ạ. Tất cả 2.400 baht." }
    - { speaker: Khách, th: "ผมจ่ายเป็นเงินสดครับ ขอใบเสร็จรับเงินด้วยครับ", vi: "Tôi trả tiền mặt. Cho tôi xin biên lai luôn." }
    - { speaker: Lễ tân, th: "นี่เงินทอนกับใบเสร็จค่ะ ขอบคุณที่มาพักกับเราค่ะ", vi: "Đây là tiền thối và biên lai ạ. Cảm ơn anh đã nghỉ ở khách sạn chúng tôi." }
  source: claude-b08
