- id: d-b07-hoi-duong
  lesson_id: b07-l8
  lines:
    - { speaker: Khách du lịch, th: "ขอโทษครับ ขอถามหน่อยครับ พิพิธภัณฑ์ไปทางไหนครับ", vi: "Xin lỗi, cho tôi hỏi chút ạ! Bảo tàng đi lối nào ạ?" }
    - { speaker: Người đi đường, th: "ตรงไปแล้วเลี้ยวซ้ายที่ไฟจราจรค่ะ", vi: "Anh đi thẳng rồi rẽ trái ở đèn giao thông." }
    - { speaker: Khách du lịch, th: "ไกลจากที่นี่แค่ไหนครับ", vi: "Cách đây bao xa ạ?" }
    - { speaker: Người đi đường, th: "ไม่ไกลค่ะ ประมาณห้าร้อยเมตร เดินไปใช้เวลาประมาณสิบนาทีค่ะ", vi: "Không xa đâu, khoảng 500 mét, đi bộ mất khoảng 10 phút." }
    - { speaker: Khách du lịch, th: "พิพิธภัณฑ์อยู่ทางซ้ายหรือทางขวาครับ", vi: "Bảo tàng ở bên trái hay bên phải ạ?" }
    - { speaker: Người đi đường, th: "อยู่ทางขวามือ ตรงข้ามไปรษณีย์ค่ะ", vi: "Ở bên tay phải, đối diện bưu điện." }
    - { speaker: Khách du lịch, th: "ขอบคุณมากครับ", vi: "Cảm ơn chị nhiều ạ." }
    - { speaker: Người đi đường, th: "ไม่เป็นไรค่ะ", vi: "Không có gì." }
  source: claude-b07
  draft: true
- id: d-b07-taxi
  lesson_id: b07-l7
  lines:
    - { speaker: Khách, th: "ไปสนามบินไหมครับ", vi: "Anh có đi sân bay không ạ?" }
    - { speaker: Tài xế, th: "ไปครับ ขึ้นรถเลยครับ", vi: "Có, mời anh lên xe." }
    - { speaker: Khách, th: "จากที่นี่ถึงสนามบินไกลแค่ไหนครับ", vi: "Từ đây đến sân bay bao xa ạ?" }
    - { speaker: Tài xế, th: "ประมาณสามสิบกิโลเมตร ใช้เวลาประมาณสี่สิบนาทีครับ", vi: "Khoảng 30 km, mất khoảng 40 phút." }
    - { speaker: Khách, th: "ผมกำลังรีบครับ ไปทางด่วนได้ไหมครับ", vi: "Tôi đang vội, đi đường cao tốc được không ạ?" }
    - { speaker: Tài xế, th: "ได้ครับ แต่ต้องจ่ายค่าทางด่วนเองนะครับ", vi: "Được, nhưng anh tự trả phí đường cao tốc nhé." }
    - { speaker: Khách, th: "ถึงแล้วใช่ไหมครับ จอดตรงนี้เลยครับ ค่ารถเท่าไรครับ", vi: "Đến rồi phải không ạ? Dừng ngay đây nhé. Tiền xe bao nhiêu ạ?" }
    - { speaker: Tài xế, th: "สามร้อยห้าสิบบาทครับ ขอบคุณครับ", vi: "350 baht. Cảm ơn anh." }
  source: claude-b07
  draft: true
