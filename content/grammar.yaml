# DỮ LIỆU MẪU (draft: true) — chỉ để chạy pipeline M6. Owner/giáo viên thay (SETUP-OWNER S10).
- id: g-u11-na
  unit_id: u11
  title_vi: น่า + động từ
  pattern: น่า + động từ
  explain_vi: น่า đứng trước động từ tạo nghĩa "đáng …" hoặc "trông …" (đáng để làm việc đó).
  examples:
    - { th: "น่ากิน", vi: "Trông ngon (rất đáng để ăn)." }
    - { th: "น่ารัก", vi: "Đáng yêu, dễ thương." }
  source: plernpin-11#p1
  draft: true
- id: g-b02-laeo
  unit_id: b02
  title_vi: Còn … thì sao?
  pattern: แล้ว + S + ล่ะคะ/ล่ะครับ
  explain_vi: Hỏi lại người nghe (hoặc người khác) cùng câu hỏi vừa được hỏi — giống "Còn bạn thì sao?". ล่ะ là văn nói (văn viết là หละ).
  examples:
    - { th: "แล้วคุณล่ะคะ", vi: "Còn bạn thì sao?" }
  source: plernpin-b02#p16
  draft: true
- id: g-b02-ko
  unit_id: b02
  title_vi: Cũng … như thế
  pattern: ก็ + V + เช่นกัน/เหมือนกัน
  explain_vi: Nói người khác cũng làm / cũng như vậy. ก็ đứng trước động từ, เช่นกัน hoặc เหมือนกัน ở cuối câu.
  examples:
    - { th: "ฉันชอบดูหนัง เขาก็ชอบเช่นกัน", vi: "Tôi thích xem phim, anh ấy cũng thích như thế." }
  source: plernpin-b02#p17
  draft: true
- id: g-b01-phuak
  unit_id: b01
  title_vi: พวก và ทั้งหลาย (số nhiều)
  pattern: พวก + đại từ · đại từ + ทั้งหลาย
  explain_vi: พวก đứng trước đại từ để chỉ số nhiều (các, những). ทั้งหลาย đứng sau đại từ, nghĩa "tất cả các".
  examples:
    - { th: "พวกคุณ", vi: "Các bạn" }
    - { th: "พวกหนู", vi: "Chúng con / các con" }
    - { th: "คุณทั้งหลาย", vi: "Tất cả các bạn" }
    - { th: "เขาทั้งหลาย", vi: "Tất cả bọn họ / các anh ấy" }
  source: plernpin-b01#p10
  draft: true
- id: g-b01-nai
  unit_id: b01
  title_vi: นาย / นาง / นางสาว + tên
  pattern: นาย / นาง / นางสาว + họ tên
  explain_vi: Danh xưng đặt trước tên người — นาย (Mr., nam), นาง (Mrs., phụ nữ đã có chồng), นางสาว (Miss, phụ nữ chưa có chồng).
  examples:
    - { th: "นาย สมชาย ใจดี", vi: "Mr. Somchai Jaidee" }
    - { th: "นาง สุภาพร ศรีสุข", vi: "Mrs. Suphaporn Srisuk" }
    - { th: "นางสาว สุดารัตน์ บุญมา", vi: "Miss Sudarat Boonma" }
  source: plernpin-b01#p9
  draft: true
- id: g-b01-mai-joe
  unit_id: b01
  title_vi: Không tìm thấy …
  pattern: S + หา + O + ไม่เจอ
  explain_vi: Nói đã tìm mà không thấy vật gì. ไม่เจอ (không thấy) đứng cuối câu.
  examples:
    - { th: "ฉันหากุญแจของฉันไม่เจอ", vi: "Tôi không tìm thấy chìa khóa của tôi." }
  source: plernpin-b01#p20
  draft: true
- id: g-b01-joe-mai
  unit_id: b01
  title_vi: Tìm thấy … chưa?
  pattern: S + หา + O + เจอไหม
  explain_vi: Hỏi người khác đã tìm thấy vật gì chưa. เจอไหม đứng cuối câu.
  examples:
    - { th: "คุณหากุญแจของคุณเจอไหม", vi: "Bạn tìm thấy chìa khóa của bạn chưa?" }
  source: plernpin-b01#p21
  draft: true
- id: g-b01-sap-mai-wa
  unit_id: b01
  title_vi: Bạn có biết … không?
  pattern: S + ทราบไหมว่า + O + V + từ để hỏi
  explain_vi: Hỏi lịch sự xem người nghe có biết thông tin gì không. Sau ทราบไหมว่า là một câu có từ để hỏi (ที่ไหน, อะไร, ใคร…).
  examples:
    - { th: "คุณทราบไหมว่ากุญแจของเขาอยู่ที่ไหน", vi: "Bạn có biết chìa khóa của anh ấy ở đâu không?" }
  source: plernpin-b01#p22
  draft: true
- id: g-c01-pairs
  unit_id: c01
  title_vi: Các cặp đại từ ngôi 1 – ngôi 2 thân mật
  pattern: ข้า–เอ็ง · เขา/เค้า–ตัว/ตัวเอง · ฉัน–เธอ · ฉัน/เรา–นาย · เรา–แก · อั๊ว–ลื้อ · กัน–แก
  explain_vi: "ข้า–เอ็ง: ta–ngươi (phim cổ trang) hoặc tớ–cậu (nam, bạn thân). เขา/เค้า–ตัว/ตัวเอง: người ta–đằng ấy, anh–em (người yêu, vợ chồng, bạn gái thân). ฉัน–เธอ, เรา–เธอ, ฉัน–นาย, เรา–นาย: tớ–cậu. เรา–แก: tôi–ông, tôi–bà. อั๊ว–ลื้อ: tớ–bạn, tao–mày (nam, ngang hàng; người Thái gốc Hoa hay dùng). กัน–แก: tớ–cậu, tao–mày (nam, nay rất hiếm)."
  examples:
    - { th: "เค้าอยากให้ตัวเองมีความสุข", vi: "Anh muốn em hạnh phúc." }
  source: plernpin-c01#p1
  draft: true
- id: g-c01-tua
  unit_id: c01
  title_vi: ตัว và ตัวเอง
  pattern: ตัว / ตัวเอง (ngôi 1 hoặc ngôi 2)
  explain_vi: Khi đứng độc lập, ตัว và ตัวเอง mang sắc thái khác nhau tùy hoàn cảnh. ตัว vừa là ngôi 1 vừa là ngôi 2. ตัวเอง là ngôi 1, ngôi 2 và còn là đại từ phản thân "bản thân mình, tự mình".
  examples:
    - { th: "ตัวยังไม่กินข้าวเลย", vi: "Mình vẫn chưa ăn gì cả." }
    - { th: "ตัวอย่าลืมทำการบ้านนะ", vi: "Cậu nhớ làm bài tập về nhà nhé." }
    - { th: "ตัวเองกินข้าวหรือยัง", vi: "Em ăn cơm chưa?" }
    - { th: "ตัวเองต้องรับผิดชอบนะ", vi: "Tự mình phải chịu trách nhiệm nhé." }
  source: plernpin-c01#p1
  draft: true
- id: g-c01-monk
  unit_id: c01
  title_vi: Xưng hô với nhà sư
  pattern: อาตมา (sư tự xưng) · หลวง + ปู่/ตา/พ่อ/ลุง/น้า/พี่ (gọi sư) · โยม (phật tử)
  explain_vi: Nhà sư tự xưng อาตมา và gọi người thường là โยม. Người thường gọi nhà sư bằng หลวง + từ chỉ vai vế phù hợp tuổi (หลวงปู่, หลวงตา, หลวงพ่อ, หลวงลุง, หลวงน้า, หลวงพี่) và tự xưng โยม, หนู, ผม, ดิฉัน. Ni cô, sư cô là แม่ชี. Bố mẹ của nhà sư là โยมพ่อ, โยมแม่; bố mẹ gọi con đã xuất gia là พระ + pháp danh hoặc พระลูกชาย.
  examples:
    - { th: "พระสมชาย", vi: "Sư Somchai (พระ + pháp danh)" }
  source: plernpin-c01#p3
  draft: true
- id: g-b10-la
  unit_id: b10
  title_vi: Mỗi … (Danh từ + ละ)
  pattern: Danh từ + ละ
  explain_vi: ละ đứng sau danh từ, nghĩa là "mỗi …".
  examples:
    - { th: "คนละ", vi: "Mỗi người" }
  source: plernpin-b10#p38
  draft: true
- id: g-b09-khoei
  unit_id: b09
  title_vi: Đã từng … chưa?
  pattern: Chủ ngữ + เคย + Động từ + … ไหม/หรือยัง
  explain_vi: Hỏi người nghe đã từng làm việc gì chưa. เคย (đã từng) đứng trước động từ, cuối câu dùng ไหม hoặc หรือยัง.
  examples:
    - { th: "คุณเคยกินส้มตำไหม", vi: "Bạn đã từng ăn Som Tam chưa?" }
    - { th: "คุณเคยกินส้มตำหรือยัง", vi: "Bạn đã từng ăn Som Tam chưa?" }
  source: plernpin-b09#p30
  draft: true
- id: g-b09-mai-dai
  unit_id: b09
  title_vi: Không … được
  pattern: Chủ ngữ + Động từ + … ไม่ได้
  explain_vi: ไม่ได้ đứng sau động từ (cuối câu) — không thể làm được việc đó.
  examples:
    - { th: "ฉันทำไม่ได้", vi: "Tôi không làm được." }
  source: plernpin-b09#p31
  draft: true
- id: g-b09-mai-pen
  unit_id: b09
  title_vi: Không biết (làm) …
  pattern: Chủ ngữ + Động từ + … ไม่เป็น
  explain_vi: ไม่เป็น đứng sau động từ (cuối câu) — không biết cách làm việc đó.
  examples:
    - { th: "ฉันทำไม่เป็น", vi: "Tôi không biết làm." }
  source: plernpin-b09#p32
  draft: true
- id: g-b08-yak
  unit_id: b08
  title_vi: Muốn + động từ
  pattern: Chủ ngữ + อยาก + Động từ
  explain_vi: อยาก (muốn) đứng trước động từ để nói mình muốn làm gì.
  examples:
    - { th: "ฉันอยากจองห้องพัก", vi: "Tôi muốn đặt phòng nghỉ." }
  source: plernpin-b08#p23
  draft: true
- id: g-b08-yak-dai
  unit_id: b08
  title_vi: Muốn có + danh từ
  pattern: Chủ ngữ + อยากได้ + Danh từ
  explain_vi: อยากได้ (muốn có) đứng trước danh từ để nói mình muốn có vật gì.
  examples:
    - { th: "ฉันอยากได้ห้องแบบเตียงคู่ค่ะ", vi: "Tôi muốn phòng kiểu giường đôi ạ." }
  source: plernpin-b08#p24
  draft: true
- id: g-b08-karuna
  unit_id: b08
  title_vi: Làm ơn … (cho tôi) với
  pattern: กรุณา + Động từ + … + (ให้ฉัน/ให้ผม) ด้วย
  explain_vi: Nhờ người khác làm việc gì một cách lịch sự. กรุณา (làm ơn) đứng đầu câu, ด้วย ở cuối câu; ให้ฉัน / ให้ผม (cho tôi) có thể thêm hoặc bỏ.
  examples:
    - { th: "กรุณาเปลี่ยนผ้าปูเตียงให้ฉันด้วย", vi: "Làm ơn đổi ga trải giường (cho tôi) với ạ." }
    - { th: "กรุณาเปลี่ยนผ้าปูเตียงให้ผมด้วย", vi: "Làm ơn đổi ga trải giường (cho tôi) với ạ." }
  source: plernpin-b08#p25
  draft: true
- id: g-b08-yak-kho
  unit_id: b08
  title_vi: Muốn xin thêm …
  pattern: Chủ ngữ + อยากขอ + Danh từ + เพิ่ม
  explain_vi: Xin thêm vật gì. อยากขอ (muốn xin) đứng trước danh từ, เพิ่ม (thêm) ở cuối câu.
  examples:
    - { th: "ฉันอยากขอผ้าเช็ดตัวเพิ่ม", vi: "Tôi muốn xin thêm khăn tắm." }
  source: plernpin-b08#p26
  draft: true
- id: g-b07-klai-chak
  unit_id: b07
  title_vi: A cách B bao xa?
  pattern: Địa điểm 1 + ไกลจาก + Địa điểm 2 + แค่ไหน
  explain_vi: Hỏi khoảng cách giữa hai địa điểm. ไกลจาก (xa từ) đứng giữa hai địa điểm, แค่ไหน (bao nhiêu) ở cuối câu.
  examples:
    - { th: "บ้านคุณไกลจากโรงเรียนแค่ไหน", vi: "Nhà bạn cách trường học bao xa?" }
  source: plernpin-b07#p30
  draft: true
- id: g-b07-chak-thueng
  unit_id: b07
  title_vi: Từ A đến B bao xa?
  pattern: จาก + Địa điểm 1 + ถึง + Địa điểm 2 + ไกลแค่ไหน
  explain_vi: Cách hỏi khoảng cách khác — จาก (từ) … ถึง (đến) …, cuối câu là ไกลแค่ไหน (xa bao nhiêu).
  examples:
    - { th: "จากบ้านคุณถึงโรงเรียนไกลแค่ไหน", vi: "Từ nhà bạn đến trường học bao xa?" }
  source: plernpin-b07#p31
  draft: true
- id: g-b07-chuai-bok-thang
  unit_id: b07
  title_vi: Giúp chỉ đường đến … cho tôi được không?
  pattern: ช่วยบอกทาง + ไป + Địa điểm + ให้ + S + หน่อยได้ไหม
  explain_vi: Nhờ người khác chỉ đường. ช่วยบอกทาง (giúp chỉ đường) + ไป + địa điểm, ให้ + người được giúp (cho …), cuối câu หน่อยได้ไหม (một chút được không).
  examples:
    - { th: "ช่วยบอกทางไปสถานีรถไฟให้ฉันหน่อยได้ไหม", vi: "Giúp chỉ đường đi đến nhà ga xe lửa cho tôi một chút được không?" }
  source: plernpin-b07#p32
  draft: true
- id: g-b07-kho-tham
  unit_id: b07
  title_vi: Xin hỏi chút ạ! … ở chỗ nào / đi lối nào?
  pattern: ขอถามหน่อยค่ะ + Địa điểm + อยู่ที่ไหน / ไปทางไหน
  explain_vi: Mở đầu lịch sự khi hỏi đường. ขอถามหน่อยค่ะ (nam nói ขอถามหน่อยครับ) + địa điểm; อยู่ที่ไหน hỏi ở chỗ nào, ไปทางไหน hỏi đi lối nào.
  examples:
    - { th: "ขอถามหน่อยค่ะ สถานีรถไฟอยู่ที่ไหน", vi: "Xin hỏi chút ạ! Nhà ga xe lửa ở chỗ nào?" }
    - { th: "ขอถามหน่อยค่ะ สถานีรถไฟไปทางไหน", vi: "Xin hỏi chút ạ! Nhà ga xe lửa đi lối nào?" }
  source: plernpin-b07#p33-34
  draft: true
- id: g-b07-sap-mai-wa
  unit_id: b07
  title_vi: Bạn có biết … ở chỗ nào / đi lối nào không?
  pattern: คุณทราบ/รู้ไหมว่า + Địa điểm + อยู่ที่ไหน / ไปทางไหน
  explain_vi: Hỏi người nghe có biết địa điểm ở đâu không. ทราบ và รู้ đều là "biết" (ทราบ lịch sự hơn); ไหมว่า + địa điểm + อยู่ที่ไหน / ไปทางไหน.
  examples:
    - { th: "คุณทราบไหมว่าสถานีรถไฟอยู่ที่ไหน", vi: "Bạn có biết nhà ga xe lửa ở chỗ nào không?" }
    - { th: "คุณรู้ไหมว่าสถานีรถไฟไปทางไหน", vi: "Bạn có biết nhà ga xe lửa đi lối nào không?" }
  source: plernpin-b07#p35-36
  draft: true
- id: g-b07-mai-sap-wa
  unit_id: b07
  title_vi: Không biết là … ở chỗ nào / đi lối nào?
  pattern: ไม่ทราบ/รู้ว่า + Địa điểm + อยู่ที่ไหน / ไปทางไหน
  explain_vi: Cách hỏi đường mềm mỏng — "không biết là … ở đâu ạ?". ไม่ทราบว่า hoặc ไม่รู้ว่า + địa điểm + อยู่ที่ไหน / ไปทางไหน.
  examples:
    - { th: "ไม่ทราบว่าสถานีรถไฟอยู่ที่ไหน", vi: "Không biết là nhà ga xe lửa ở chỗ nào?" }
    - { th: "ไม่รู้ว่าสถานีรถไฟไปทางไหน", vi: "Không biết là nhà ga xe lửa đi lối nào?" }
  source: plernpin-b07#p37-38
  draft: true
- id: g-b06-ti
  unit_id: b06
  title_vi: Giờ từ 1 đến 5 giờ sáng
  pattern: ตี + số giờ
  explain_vi: Từ 1 giờ đến 5 giờ sáng, nói ตี trước số giờ.
  examples:
    - { th: "ตีหนึ่ง", vi: "1:00 (1 giờ sáng)" }
    - { th: "ตีสอง", vi: "2:00" }
    - { th: "ตีสาม", vi: "3:00" }
    - { th: "ตีสี่", vi: "4:00" }
    - { th: "ตีห้า", vi: "5:00" }
  source: plernpin-b06#p7
  draft: true
- id: g-b06-mong-chao
  unit_id: b06
  title_vi: Giờ từ 6 đến 11 giờ sáng
  pattern: số giờ + โมงเช้า
  explain_vi: Từ 6 giờ đến 11 giờ sáng, nói số giờ rồi thêm โมงเช้า.
  examples:
    - { th: "หกโมงเช้า", vi: "6:00" }
    - { th: "เจ็ดโมงเช้า", vi: "7:00" }
    - { th: "แปดโมงเช้า", vi: "8:00" }
    - { th: "เก้าโมงเช้า", vi: "9:00" }
    - { th: "สิบโมงเช้า", vi: "10:00" }
    - { th: "สิบเอ็ดโมงเช้า", vi: "11:00" }
  source: plernpin-b06#p8
  draft: true
- id: g-b06-bai
  unit_id: b06
  title_vi: 12 giờ trưa và từ 1 đến 4 giờ chiều
  pattern: เที่ยงวัน / เที่ยง (12 giờ trưa) · บ่าย + số giờ + โมง
  explain_vi: 12 giờ trưa là เที่ยงวัน hoặc เที่ยง. Từ 1 giờ đến 4 giờ chiều, nói บ่าย + số giờ + โมง; 1 giờ chiều còn nói gọn là บ่ายโมง.
  examples:
    - { th: "เที่ยงวัน", vi: "12:00" }
    - { th: "บ่ายหนึ่งโมง", vi: "13:00 (บ่ายโมง)" }
    - { th: "บ่ายสองโมง", vi: "14:00" }
    - { th: "บ่ายสามโมง", vi: "15:00" }
    - { th: "บ่ายสี่โมง", vi: "16:00" }
  source: plernpin-b06#p9
  draft: true
- id: g-b06-mong-yen
  unit_id: b06
  title_vi: Giờ từ 5 đến 6 giờ chiều
  pattern: số giờ + โมงเย็น
  explain_vi: 5 giờ và 6 giờ chiều, nói số giờ rồi thêm โมงเย็น.
  examples:
    - { th: "ห้าโมงเย็น", vi: "17:00" }
    - { th: "หกโมงเย็น", vi: "18:00" }
  source: plernpin-b06#p10
  draft: true
- id: g-b06-thum
  unit_id: b06
  title_vi: Giờ từ 7 đến 12 giờ tối
  pattern: số giờ + ทุ่ม
  explain_vi: Từ 7 giờ đến 12 giờ tối, đếm lại từ 1 rồi thêm ทุ่ม (19:00 = หนึ่งทุ่ม). 24:00 là หกทุ่ม hoặc เที่ยงคืน. Lưu ý (GV) — cách nói cũ theo canh — ยามหนึ่ง = 9 giờ tối, สองยาม = nửa đêm (24h), สามยาม = 3 giờ sáng.
  examples:
    - { th: "หนึ่งทุ่ม", vi: "19:00" }
    - { th: "สองทุ่ม", vi: "20:00" }
    - { th: "สามทุ่ม", vi: "21:00" }
    - { th: "สี่ทุ่ม", vi: "22:00" }
    - { th: "ห้าทุ่ม", vi: "23:00" }
    - { th: "หกทุ่ม", vi: "24:00 (เที่ยงคืน)" }
  source: plernpin-b06#p11
  draft: true
- id: g-b06-nathi
  unit_id: b06
  title_vi: Giờ + phút (kiểu Thái)
  pattern: giờ + số phút + นาที
  explain_vi: Nói giờ theo kiểu Thái trước, rồi thêm số phút + นาที.
  examples:
    - { th: "เก้าโมงเช้าสิบห้านาที", vi: "9 giờ 15 phút sáng" }
  source: plernpin-b06#p12
  draft: true
- id: g-b06-nalika
  unit_id: b06
  title_vi: Nói giờ kiểu quốc tế
  pattern: số giờ (0–24) + นาฬิกา (+ số phút + นาที)
  explain_vi: Kiểu quốc tế dùng số giờ 24h + นาฬิกา, viết tắt น. (vd. 21.00 น.). Muốn nói phút thì thêm số phút + นาที.
  examples:
    - { th: "เก้านาฬิกา", vi: "9 giờ sáng (9.00 น.)" }
    - { th: "ยี่สิบเอ็ดนาฬิกา", vi: "9 giờ tối (21.00 น.)" }
    - { th: "ยี่สิบเอ็ดนาฬิกาสิบนาที", vi: "9 giờ 10 phút tối (21.10 น.)" }
  source: plernpin-b06#p13-15
  draft: true
- id: g-b06-ik
  unit_id: b06
  title_vi: Giờ kém
  pattern: อีก + số phút + นาที + giờ
  explain_vi: Nói giờ kém — อีก (còn) + số phút + giờ sắp tới. Dùng được với cả kiểu Thái và kiểu quốc tế.
  examples:
    - { th: "อีกห้านาทีบ่ายสี่โมง", vi: "4 giờ kém 5 phút chiều" }
    - { th: "อีกห้านาทีสิบหกนาฬิกา", vi: "4 giờ kém 5 phút chiều (kiểu quốc tế)" }
  source: plernpin-b06#p16-17
  draft: true
- id: g-b05-wan-arai
  unit_id: b05
  title_vi: Hỏi và trả lời về thứ
  pattern: Trạng từ chỉ TG + วัน + อะไร + คะ/ครับ · Trạng từ chỉ TG + thứ + ค่ะ/ครับ
  explain_vi: Hỏi thứ — trạng từ chỉ thời gian (วันนี้, พรุ่งนี้…) + วันอะไร. Trả lời — trạng từ chỉ thời gian + tên thứ.
  examples:
    - { th: "วันนี้วันอะไรคะ", vi: "Hôm nay thứ mấy ạ?" }
    - { th: "วันนี้วันจันทร์ค่ะ", vi: "Hôm nay thứ hai ạ" }
  source: plernpin-b05#p7-8
  draft: true
- id: g-b05-wan-thi
  unit_id: b05
  title_vi: Hỏi và trả lời ngày dương lịch
  pattern: Trạng từ chỉ TG + (เป็น) วันที่ + เท่าไหร่ / con số + คะ/ครับ
  explain_vi: Hỏi ngày — trạng từ chỉ thời gian + (เป็น) วันที่เท่าไหร่. Trả lời — thay เท่าไหร่ bằng con số. เป็น có thể bỏ.
  examples:
    - { th: "วันนี้เป็นวันที่เท่าไหร่คะ", vi: "Hôm nay (là) ngày bao nhiêu ạ?" }
    - { th: "วันนี้เป็นวันที่สิบสองค่ะ", vi: "Hôm nay (là) ngày 12 ạ" }
  source: plernpin-b05#p9-10
  draft: true
- id: g-b05-khuen-raem
  unit_id: b05
  title_vi: Nói ngày âm lịch (ขึ้น … ค่ำ / แรม … ค่ำ)
  pattern: Trạng từ chỉ TG + (เป็น) ขึ้น … ค่ำ / แรม … ค่ำ + ค่ะ/ครับ
  explain_vi: 15 ngày đầu tháng âm lịch nói ขึ้น + số + ค่ำ (ขึ้น 15 ค่ำ = ngày rằm). 15 ngày sau nói แรม + số + ค่ำ (แรม 2 ค่ำ = ngày 17).
  examples:
    - { th: "วันนี้เป็นขึ้น 15 ค่ำค่ะ", vi: "Hôm nay (là) ngày rằm ạ" }
    - { th: "วันนี้เป็นแรม 2 ค่ำค่ะ", vi: "Hôm nay (là) ngày 17 ạ" }
  source: plernpin-b05#p11-12
  draft: true
- id: g-b05-duean-suffix
  unit_id: b05
  title_vi: Hậu tố tên tháng (คม / ยน / พันธ์)
  pattern: tên tháng + คม (31 ngày) / ยน (30 ngày) / พันธ์ (tháng 2)
  explain_vi: Các tháng có 31 ngày có hậu tố คม, các tháng có 30 ngày có hậu tố ยน (riêng tháng 2 có hậu tố พันธ์). Trong cách nói chuyện hằng ngày, người Thái thường bỏ các hậu tố này, vì thế เดือนมกราคม sẽ trở thành เดือนมกราฯ.
  examples:
    - { th: "เดือนมกราคม", vi: "Tháng 1 (31 ngày → คม)" }
    - { th: "เดือนเมษายน", vi: "Tháng 4 (30 ngày → ยน)" }
    - { th: "เดือนกุมภาพันธ์", vi: "Tháng 2 (→ พันธ์)" }
    - { th: "เดือนมกราฯ", vi: "Tháng 1 (văn nói, bỏ hậu tố)" }
  source: plernpin-b05#p16
  draft: true
- id: g-b05-duean-arai
  unit_id: b05
  title_vi: Hỏi và trả lời về tháng
  pattern: Trạng từ chỉ TG + เดือน + อะไร + คะ/ครับ · Trạng từ chỉ TG + tháng + ค่ะ/ครับ
  explain_vi: Hỏi tháng — trạng từ chỉ thời gian (เดือนนี้, เดือนหน้า…) + เดือนอะไร. Trả lời — trạng từ chỉ thời gian + เดือน + tên tháng.
  examples:
    - { th: "เดือนนี้เดือนอะไรคะ", vi: "Tháng này tháng mấy ạ?" }
    - { th: "เดือนนี้เดือนมีนาคมค่ะ", vi: "Tháng này tháng 3 ạ" }
  source: plernpin-b05#p22-23
  draft: true
- id: g-b05-duean-chan
  unit_id: b05
  title_vi: Tháng theo âm lịch (เดือนตามจันทรคติ)
  pattern: เดือนอ้าย · เดือนยี่ · เดือน + số (từ tháng 3)
  explain_vi: Âm lịch có 12 tháng. Tháng 1 là เดือนอ้าย, tháng 2 là เดือนยี่; từ tháng 3 đến tháng 12 nói เดือน + số (tài liệu viết bằng chữ số Thái ๓ … ๑๒).
  examples:
    - { th: "เดือนอ้าย", vi: "Tháng 1 (âm lịch)" }
    - { th: "เดือนยี่", vi: "Tháng 2 (âm lịch)" }
    - { th: "เดือน ๓", vi: "Tháng 3 (âm lịch)" }
    - { th: "เดือน ๑๒", vi: "Tháng 12 (âm lịch)" }
  source: plernpin-b05#p17-19
  draft: true
- id: g-b05-pi-naksat
  unit_id: b05
  title_vi: Hỏi và trả lời về năm con giáp
  pattern: Trạng từ chỉ TG + ปีนักษัตร + อะไร + คะ/ครับ · Trạng từ chỉ TG + năm con giáp + ค่ะ/ครับ
  explain_vi: Hỏi năm con giáp — ปีนี้ปีนักษัตรอะไร. Trả lời — ปีนี้ + tên năm con giáp (ปีชวด … ปีกุน).
  examples:
    - { th: "ปีนี้ปีนักษัตรอะไรคะ", vi: "Năm nay năm con giáp gì ạ?" }
    - { th: "ปีนี้ปีมะเส็งค่ะ", vi: "Năm nay năm tỵ ạ" }
  source: plernpin-b05#p34-35
  draft: true
- id: g-b05-pi
  unit_id: b05
  title_vi: Hỏi và trả lời về năm (phật lịch / công lịch)
  pattern: Trạng từ chỉ TG + ปี + อะไร + คะ/ครับ · Trạng từ chỉ TG + ปี พ.ศ./ปี ค.ศ. + năm + ค่ะ/ครับ
  explain_vi: (p24) Năm chính thức ở Thái Lan được tính kể từ 543 trước công nguyên, bắt đầu kỉ nguyên đạo phật. Do đó, 2000 sau công nguyên tương tự 2543 theo phật lịch (năm phật lịch = năm công lịch + 543). Ví dụ — bạn sinh năm 1978 thì theo phật lịch sẽ là 2521.
  examples:
    - { th: "ปีนี้ปีอะไรคะ", vi: "Năm nay năm gì ạ?" }
    - { th: "ปีนี้ปีค.ศ. 2025 ค่ะ", vi: "Năm nay năm công lịch 2025 ạ" }
    - { th: "ปีนี้ปีพ.ศ. 2568 ค่ะ", vi: "Năm nay năm phật lịch 2568 ạ" }
  source: plernpin-b05#p31-33
  draft: true
- id: g-b05-rudu
  unit_id: b05
  title_vi: Hỏi và trả lời về mùa
  pattern: Trạng từ chỉ TG + S + V + ใน + ฤดูไหน + คะ/ครับ · Trạng từ chỉ TG + S + V + ใน + tên mùa + ค่ะ/ครับ
  explain_vi: Hỏi đang ở mùa nào — ตอนนี้เราอยู่ในฤดูไหน. Trả lời — thay ฤดูไหน bằng tên mùa.
  examples:
    - { th: "ตอนนี้เราอยู่ในฤดูไหนคะ", vi: "Bây giờ chúng ta ở trong mùa nào ạ?" }
    - { th: "ตอนนี้เราอยู่ในฤดูร้อนค่ะ", vi: "Bây giờ chúng ta ở trong mùa hè ạ" }
  source: plernpin-b05#p38-39
  draft: true
- id: g-b04-laksananam
  unit_id: b04
  title_vi: Loại từ (ลักษณนาม)
  pattern: Danh từ + Số từ (từ 2 trở lên) + Loại từ
  explain_vi: Loại từ giữ chức năng biểu thị các đặc trưng về hình dáng, chủng loại hoặc số lượng của danh từ đi cùng với nó. Không giống như loại từ trong tiếng Việt, loại từ trong tiếng Thái luôn đi sau danh từ.
  examples:
    - { th: "สบู่ 2 ก้อน", vi: "2 cục bánh xà phòng" }
    - { th: "หมา 2 ตัว", vi: "2 con chó" }
    - { th: "หนังสือ 2 เล่ม", vi: "2 quyển sách" }
    - { th: "รถยนต์ 2 คัน", vi: "2 chiếc xe ô tô" }
  source: plernpin-b04#p3
  draft: true
- id: g-b04-nueng
  unit_id: b04
  title_vi: Số lượng “1” với loại từ
  pattern: Danh từ + Số từ + Loại từ · Danh từ + Loại từ + Số từ · Danh từ + Loại từ + เดียว
  explain_vi: Nếu số từ chỉ số lượng mà rơi vào “1” thì có 3 cách diễn đạt như trên.
  examples:
    - { th: "ผู้หญิงหนึ่งคน", vi: "1 người phụ nữ" }
    - { th: "ผู้หญิงคนหนึ่ง", vi: "1 người phụ nữ" }
    - { th: "ผู้หญิงคนเดียว", vi: "1 người phụ nữ (chỉ một)" }
  source: plernpin-b04#p4-5
  draft: true
- id: g-b04-thao-kap
  unit_id: b04
  title_vi: So sánh bằng (เท่ากับ)
  pattern: S1 + đặc tính so sánh + เท่ากับ + S2
  explain_vi: So sánh bằng — đặt เท่ากับ giữa đặc tính so sánh và S2.
  examples:
    - { th: "ดาวอายุเท่ากับเดือน", vi: "Đao bằng tuổi với Đươn" }
  source: plernpin-b04#p44
  draft: true
- id: g-b04-thao-kan
  unit_id: b04
  title_vi: So sánh bằng (… และ … เท่ากัน)
  pattern: S1 + และ + S2 + đặc tính so sánh + เท่ากัน
  explain_vi: So sánh bằng — nối S1 và S2 bằng และ, đặt เท่ากัน ở cuối.
  examples:
    - { th: "ดาวและเดือนอายุเท่ากัน", vi: "Đao và Đươn bằng tuổi nhau" }
  source: plernpin-b04#p45
  draft: true
- id: g-b04-kwa
  unit_id: b04
  title_vi: So sánh hơn (กว่า)
  pattern: S1 + đặc tính so sánh + (มาก/น้อย) กว่า + S2 + (phần bổ sung mức độ)
  explain_vi: So sánh hơn — đặc tính so sánh + (มาก/น้อย) กว่า + S2; có thể thêm mức độ chênh lệch ở cuối.
  examples:
    - { th: "ดาวอายุมากกว่าเดือน 2 ปี", vi: "Đao nhiều hơn Đươn 2 tuổi" }
    - { th: "เดือนอายุน้อยกว่าดาว 2 ปี", vi: "Đươn ít hơn Đao 2 tuổi" }
  source: plernpin-b04#p46
  draft: true
- id: g-b04-thi-sut
  unit_id: b04
  title_vi: So sánh nhất (ที่สุด)
  pattern: S1 + đặc tính so sánh + (มาก/น้อย) ที่สุด + …
  explain_vi: So sánh nhất — đặc tính so sánh + (มาก/น้อย) ที่สุด, sau đó có thể thêm phạm vi so sánh.
  examples:
    - { th: "ดาวอายุมากที่สุดในห้องนี้", vi: "Đao nhiều tuổi nhất trong phòng này" }
    - { th: "เดือนอายุน้อยที่สุดในห้องนี้", vi: "Đươn ít tuổi nhất trong phòng này" }
  source: plernpin-b04#p47
  draft: true
- id: g-b03-et-yi
  unit_id: b03
  title_vi: Đọc số 1 ở hàng đơn vị (เอ็ด) và số 2 ở hàng chục (ยี่)
  pattern: … + เอ็ด (1 ở hàng đơn vị) · ยี่ + สิบ (2 ở hàng chục)
  explain_vi: Số “1” mà rơi vào hàng đơn vị thì sẽ đọc là “เอ็ด”. Số “2” mà rơi vào hàng chục thì sẽ đọc là “ยี่”.
  examples:
    - { th: "สิบเอ็ด", vi: "11" }
    - { th: "ยี่สิบ", vi: "20" }
    - { th: "ยี่สิบเอ็ด", vi: "21" }
    - { th: "หนึ่งร้อยเอ็ด", vi: "101" }
  source: plernpin-b03#p13
  draft: true
- id: g-b03-lak
  unit_id: b03
  title_vi: Thứ tự các hàng và đơn vị
  pattern: สิบ → ร้อย → พัน → หมื่น → แสน → ล้าน → สิบล้าน → ร้อยล้าน → พันล้าน → หมื่นล้าน → แสนล้าน → ล้านล้าน
  explain_vi: Đọc số lớn theo thứ tự các hàng — chục (สิบ), trăm (ร้อย), nghìn (พัน), chục nghìn (หมื่น), trăm nghìn (แสน), triệu (ล้าน)… Tiếng Thái có từ riêng cho hàng chục nghìn (หมื่น) và trăm nghìn (แสน).
  examples:
    - { th: "หนึ่งร้อยยี่สิบสาม", vi: "123" }
    - { th: "หนึ่งพันสองร้อยสามสิบ", vi: "1,230" }
    - { th: "หนึ่งพันสามร้อยยี่สิบสี่", vi: "1,324" }
    - { th: "หนึ่งหมื่นเอ็ด", vi: "10,001" }
    - { th: "สิบล้าน", vi: "10,000,000" }
  source: plernpin-b03#p23
  draft: true
- id: g-b03-doc-dau
  unit_id: b03
  title_vi: Một số quy tắc đọc (จุด, ทับ, ถึง, ต่อ, ที่ + số)
  pattern: “.” → จุด · “/” → ทับ · “-” → ถึง · “:” → ต่อ · ที่ + con số
  explain_vi: Dấu “.” đọc là จุด, dấu “/” đọc là ทับ, dấu “-” đọc là ถึง, dấu “:” đọc là ต่อ. ที่ + con số chỉ về số thứ tự.
  examples:
    - { th: "ที่หนึ่ง", vi: "Thứ nhất" }
    - { th: "บ้านเลขที่ 33/551", vi: "Số nhà 33/551 (/ đọc là ทับ)" }
    - { th: "25-50 เปอร์เซ็นต์", vi: "25-50% (- đọc là ถึง)" }
  source: plernpin-b03#p24
  draft: true
- id: g-b03-ban-lek-thi
  unit_id: b03
  title_vi: Đọc số nhà
  pattern: บ้านเลขที่ + số
  explain_vi: Số nhà nói บ้านเลขที่ + số; dấu “/” đọc là ทับ.
  examples:
    - { th: "บ้านเลขที่ 33/551", vi: "Số nhà 33/551" }
    - { th: "บ้านเลขที่ 150/7", vi: "Số nhà 150/7" }
  source: plernpin-b03#p25-26
  draft: true
- id: g-b03-zero
  unit_id: b03
  title_vi: Số có số 0 dẫn trước
  pattern: 0 … → đọc từng con số
  explain_vi: Trong trường hợp mà số nhà có số 0 dẫn trước thì phải đọc theo thứ tự từng con số.
  examples:
    - { th: "บ้านเลขที่ 0864/1108", vi: "Số nhà 0864/1108 (đọc từng con số)" }
  source: plernpin-b03#p27
  draft: true
- id: g-b03-percent
  unit_id: b03
  title_vi: Đọc phần trăm
  pattern: Số + เปอร์เซ็นต์
  explain_vi: Phần trăm nói số + เปอร์เซ็นต์ (cũng nói ร้อยละ + số).
  examples:
    - { th: "30 เปอร์เซ็นต์", vi: "30%" }
    - { th: "25-50 เปอร์เซ็นต์", vi: "25-50%" }
  source: plernpin-b03#p28-29
  draft: true
- id: g-b03-tho
  unit_id: b03
  title_vi: Đọc số điện thoại
  pattern: โทรศัพท์ (โทร.) + Số ĐT
  explain_vi: Số điện thoại nói โทรศัพท์ hoặc viết tắt โทร. + số điện thoại, đọc từng con số.
  examples:
    - { th: "โทรศัพท์ 084 989 1952", vi: "Điện thoại 084 989 1952" }
    - { th: "โทร. 084 989 1952", vi: "ĐT 084 989 1952" }
  source: plernpin-b03#p30-31
  draft: true
- id: g-b03-thot-sa-niyom
  unit_id: b03
  title_vi: Đọc số thập phân (การอ่านตัวเลขที่มีจุดทศนิยม)
  pattern: số nguyên + จุด + từng con số
  explain_vi: Các số ở phía trước dấu thập phân được đọc như một số nguyên, còn các số sau dấu thập phân được đọc theo thứ tự từng số một. Lưu ý (GV) — với đơn vị tiền, đo lường thì đọc theo đơn vị nhỏ hơn.
  examples:
    - { th: "ห้าบาทเจ็ดสิบห้าสตางค์", vi: "5.75 บาท (5 bạt 75 stang)" }
    - { th: "สามเมตรห้าสิบแปดเซนติเมตร", vi: "3.58 เมตร (3 m 58 cm)" }
    - { th: "สองกิโลกรัมสองร้อยห้ากรัม", vi: "2.205 กิโลกรัม (2 kg 205 gam)" }
  source: plernpin-b03#p32-34
  draft: true
- id: g-b03-thang-luang
  unit_id: b03
  title_vi: Đọc số đường quốc lộ (การอ่านหมายเลขทางหลวง)
  pattern: หมายเลขทางหลวง + số (đọc từng con số một)
  explain_vi: Cách đọc — đọc từng con số một.
  examples:
    - { th: "หมายเลขทางหลวง ๒๑", vi: "Quốc lộ 21" }
    - { th: "หมายเลขทางหลวง ๓๑๔", vi: "Quốc lộ 314" }
  source: plernpin-b03#p35-36
  draft: true
- id: g-b03-set-suan
  unit_id: b03
  title_vi: Đọc phân số (เศษส่วน)
  pattern: เศษ + tử số + ส่วน + mẫu số
  explain_vi: Phân số thành lập bằng cách thêm เศษ vào trước tử số và thêm ส่วน vào trước mẫu số. Nếu tử số bằng 1 thì เศษ có thể bỏ đi. 1/2 còn có nghĩa là một nửa nên có từ riêng là “ครึ่ง”. Trong một số trường hợp dùng để nhấn mạnh người ta có thể nói 3/4 là “สามในสี่”.
  examples:
    - { th: "เศษสองส่วนสาม", vi: "2/3" }
    - { th: "ครึ่ง", vi: "1/2 (một nửa)" }
    - { th: "ประชาชนสามในสี่", vi: "3/4 dân số" }
  source: plernpin-b03#p37-40
  draft: true
- id: g-b03-thao
  unit_id: b03
  title_vi: Đọc bội số (gấp … lần)
  pattern: Tính từ / Trạng từ + กว่า + NUMBER + เท่า
  explain_vi: Nói gấp bao nhiêu lần — tính từ / trạng từ + กว่า + số + เท่า.
  examples:
    - { th: "ใหญ่กว่าสามเท่า", vi: "To hơn gấp 3 lần" }
    - { th: "สนุกกว่าพันเท่า", vi: "Vui hơn gấp ngàn lần" }
  source: plernpin-b03#p43-44
  draft: true
- id: g-b03-ayu
  unit_id: b03
  title_vi: Đọc số tuổi (ปี / ขวบ)
  pattern: S + อายุ + NUMBER (≥ 12) + ปี · S + อายุ + NUMBER (< 12) + ขวบ
  explain_vi: Từ 12 tuổi trở lên dùng ปี; dưới 12 tuổi dùng ขวบ.
  examples:
    - { th: "ฉันอายุยี่สิบปี", vi: "Tôi 20 tuổi" }
    - { th: "หนูอายุห้าขวบ", vi: "Em 5 tuổi" }
  source: plernpin-b03#p45-46
  draft: true
- id: g-c15-pai
  unit_id: c15
  title_vi: "Cách sử dụng của ไป"
  pattern: "เข้า / ออก / ผ่าน / ลง / ขึ้น + ไป"
  explain_vi: "ไป đứng sau động từ chỉ hướng: hướng di chuyển ra xa người nói. เข้าไป: đi vào (đứng bên ngoài nhìn). ออกไป: đi ra (đứng bên trong nhìn). ผ่านไป: trôi đi, qua đi. ลงไป: đi xuống. ขึ้นไป: đi lên."
  examples:
    - { th: "เขากำลังเข้าไปข้างใน", vi: "Anh ấy đang đi vào bên trong" }
    - { th: "เขากำลังออกไปข้างนอก", vi: "Anh ấy đang đi ra bên ngoài" }
    - { th: "เวลาผ่านไปอย่างรวดเร็ว", vi: "Thời gian trôi đi một cách nhanh chóng" }
    - { th: "ลงบันไดไป แล้วเลี้ยวขวา ห้องน้ำจะอยู่ทางขวามือ", vi: "Đi xuống cầu thang, rồi rẽ phải. Phòng vệ sinh sẽ ở bên tay phải" }
    - { th: "เดินขึ้นบันไดไปชั้นแปด", vi: "Đi bộ đi lên cầu thang tầng 8" }
  source: plernpin-c15#p1
  draft: true
- id: g-c15-pai-laeo
  unit_id: c15
  title_vi: "V + แล้ว và V + ไปแล้ว"
  pattern: "V + แล้ว · V + ไปแล้ว"
  explain_vi: "V + แล้ว: cái gì vừa mới … rồi. V + ไปแล้ว: cái gì đã … từ lâu rồi."
  examples:
    - { th: "ร้านนี้ปิดแล้ว", vi: "Cửa hàng này đóng rồi (vì giờ làm việc từ 9h-17h)" }
    - { th: "ร้านนี้ปิดไปแล้ว", vi: "Quán này đã đóng rồi (đóng từ lâu rồi, ngừng kinh doanh rồi)" }
  source: plernpin-c15#p1
  draft: true
- id: g-c15-ma
  unit_id: c15
  title_vi: "Cách sử dụng của มา"
  pattern: "เข้า / ออก / ผ่าน / ลง / ขึ้น + มา"
  explain_vi: "มา đứng sau động từ chỉ hướng: hướng di chuyển lại gần người nói. เข้ามา: vào đến, vào đây (đứng bên trong nhìn). ออกมา: đi ra, ra đây (đứng bên ngoài nhìn). ผ่านมา: vừa qua. ลงมา: xuống đến, xuống đây. ขึ้นมา: lên đến, lên đây."
  examples:
    - { th: "เขากำลังเข้ามาข้างใน", vi: "Anh ấy đang vào đến bên trong" }
    - { th: "เขากำลังออกมาข้างนอก", vi: "Anh ấy đang đi ra bên ngoài" }
    - { th: "ขอบคุณทุกคนที่ช่วยเหลือหนูตลอดปีที่ผ่านมา", vi: "Cảm ơn mọi người cái mà đã giúp đỡ em suốt năm vừa qua" }
    - { th: "เดินลงบันไดมา", vi: "Đi bộ xuống đến cầu thang" }
    - { th: "เดินขึ้นบันไดมา", vi: "Đi bộ lên đến cầu thang" }
  source: plernpin-c15#p2
  draft: true
- id: g-c15-ma-da
  unit_id: c15
  title_vi: "มา mang nghĩa “đã”, มาก่อน, เสมอมา = มาตลอด"
  pattern: "V + มา (นาน) แล้ว · V + มาก่อน · V + เสมอมา / มาตลอด"
  explain_vi: "Từ มา mang nghĩa “đã”. Trong cụm từ มาก่อน, มา mang nghĩa “trước đây”. เสมอมา = มาตลอด: suốt, luôn luôn; trong đó เสมอมา: từ trước đến nay vẫn vậy (thể hiện sự ổn định, không đổi); มาตลอด: suốt từ đầu đến nay (nhấn mạnh vào quá trình liên tục, diễn ra liên tục)."
  examples:
    - { th: "เขาแต่งงานกับเธอมานานแล้ว แต่ปัจจุบันนี้เขาหย่าแล้ว", vi: "Anh ấy kết hôn với cô ấy đã lâu rồi, nhưng hiện tại họ ly hôn rồi" }
    - { th: "คุณเคยทำงานนี้มาก่อนไหม", vi: "Bạn đã từng làm việc này trước đây chưa?" }
    - { th: "เขาดีกับฉันเสมอมา", vi: "Anh ấy luôn luôn tốt với tôi" }
    - { th: "ชาวนาทำงานหนักมาตลอด", vi: "Người nông dân làm việc vất vả suốt" }
  source: plernpin-c15#p2
  draft: true
- id: g-c15-pai-ma
  unit_id: c15
  title_vi: "Sự khác biệt giữa ไป và มา"
  pattern: "ไป (đi, xa người nói) · มา (về / đến, gần người nói)"
  explain_vi: "ไป: cả người nghe và người nói chưa ở địa điểm đó; มา: cả người nghe và người nói đang ở địa điểm đó rồi. ไป: hướng của hành động xuất phát từ người nói; มา: hướng của hành động hướng tới người nói. ไป: mang nghĩa gốc là “đi”; มา: mang nghĩa gốc là “về”."
  examples:
    - { th: "เธอไปทำงานยังไง", vi: "Bạn đi làm việc bằng gì?" }
    - { th: "หนูมาเรียนยังไง", vi: "Em đến học bằng gì?" }
    - { th: "ฉันไปหาหมอที่โรงพยาบาล", vi: "Tôi đi tìm bác sĩ ở bệnh viện" }
    - { th: "เพื่อนมาหาฉันที่บ้าน", vi: "Bạn đến tìm tôi ở nhà" }
    - { th: "ไปๆมาๆระหว่างไทยกับเวียดนาม", vi: "Đi đi về về giữa Thái Lan với Việt Nam" }
  source: plernpin-c15#p3
  draft: true
- id: g-c15-ya
  unit_id: c15
  title_vi: "อย่าไป và อย่ามา"
  pattern: "อย่าไป + V · อย่ามา + V"
  explain_vi: "อย่าไป: đừng (dặn trước nhưng chưa xảy ra). อย่ามา: đừng (sự việc đang xảy ra)."
  examples:
    - { th: "อย่าไปเชื่อเขานะ", vi: "Đừng tin anh ấy nhé (dặn trước)" }
    - { th: "อย่ามาพูดแบบนี้นะ", vi: "Đừng nói kiểu này nhé (đang xảy ra)" }
  source: plernpin-c15#p4
  draft: true
- id: g-c14-som
  unit_id: c14
  title_vi: "Cách sử dụng của từ สม"
  pattern: "สม + …"
  explain_vi: "Các từ ghép với สม: สมน้ำหน้า (đáng đời), สมพรปาก (mong được như bạn nói, mong ứng nghiệm như bạn nói), สมหวัง (đạt được ý nguyện — ได้อย่างที่หวัง), สมควร (xứng đáng, đáng, nên), สมบูรณ์ (hoàn chỉnh, trọn vẹn, đầy đặn, hoàn hảo), สมเหตุสมผล (hợp lý, có lý — có lý do chính đáng = มีเหตุผลที่ดี), สมรู้ร่วมคิด (âm mưu, hiệp lực), สมส่วน (cân đối, cân xứng)."
  examples:
    - { th: "สมน้ำหน้า", vi: "Đáng đời" }
    - { th: "สมพรปาก", vi: "Mong được như bạn nói" }
  source: plernpin-c14#p1
  draft: true
- id: g-c13-wa-noi
  unit_id: c13
  title_vi: "Từ ว่า mang nghĩa “nói, bảo”"
  pattern: "S + ว่า + …"
  explain_vi: "ว่า đứng sau chủ ngữ, mang nghĩa “nói, bảo”."
  examples:
    - { th: "เธอว่าอะไรนะ ฉันฟังไม่ทัน", vi: "Cô ấy nói gì? Tôi chưa kịp nghe" }
    - { th: "เขาว่าที่นี่ฝนตกทุกวัน", vi: "Anh ấy nói ở đây ngày nào cũng mưa" }
  source: plernpin-c13#p1
  draft: true
- id: g-c13-wa-rang
  unit_id: c13
  title_vi: "Từ ว่า mang nghĩa “là, rằng” (theo sau động từ)"
  pattern: "S + động từ + ว่า + mệnh đề"
  explain_vi: "ว่า mang nghĩa “là, rằng”, được sử dụng theo sau động từ. Các trường hợp của ว่า: พูดว่า (nói là, nói rằng), บอกว่า (bảo là, bảo rằng), รู้ว่า (biết là, biết rằng), ได้ยินว่า (nghe thấy là, nghe thấy rằng), ฝันว่า (mơ là), เข้าใจว่า (hiểu là, hiểu rằng), สัญญาว่า (hứa là, hứa rằng), ถามว่า (hỏi là, hỏi rằng), ดูว่า (xem là), แปลว่า (dịch là), อ่านว่า (đọc là), เรียกว่า (gọi là), ถึงแม้ว่า (mặc dù là), เพื่อว่า (để mà), จำได้ว่า (nhớ được là), เชื่อว่า (tin tưởng là), เห็นว่า (thấy là), กลัวว่า (sợ là), คิดว่า (nghĩ là), แน่ใจว่า (chắc chắn là), เป็นห่วงว่า (lo lắng là), รู้สึกว่า (cảm thấy là), ทราบว่า (biết là), สงสัยว่า (nghi ngờ là), หวังว่า (hy vọng là)."
  examples:
    - { th: "เขาพูดว่าเขาชอบประเทศไทย", vi: "Anh ấy nói là anh ấy thích nước Thái" }
    - { th: "ฉันคิดว่าจะกลับพรุ่งนี้", vi: "Tôi nghĩ là sẽ quay trở về vào ngày mai" }
  source: plernpin-c13#p1
  draft: true
- id: g-c13-thuk
  unit_id: c13
  title_vi: "Từ ถูก mang nghĩa “rẻ”, “đúng”, “đụng, chạm”, “hợp ý”"
  pattern: "ถูก · ถูก + danh từ (ถูกตัว, ถูกใจ, ถูกคอ, ถูกชะตา…)"
  explain_vi: "ถูก mang nghĩa “rẻ”; “đúng, chính xác”; “đụng, chạm, tiếp xúc” (ถูกตัว: tiếp xúc cơ thể, chạm vào người; ถูกลอตเตอรี่: trúng xổ số); “hợp gu, đúng gu, hợp ý, ăn ý” (ถูกใจ: đúng gu, hợp gu; ถูกคอ: hợp ý, ăn ý; ถูกชะตา: đúng định mệnh)."
  examples:
    - { th: "ถูกตัว", vi: "Tiếp xúc cơ thể, chạm vào người" }
    - { th: "ถูกลอตเตอรี่", vi: "Trúng xổ số" }
    - { th: "ถูกใจ", vi: "Đúng gu, hợp gu" }
    - { th: "ถูกคอ", vi: "Hợp ý, ăn ý" }
    - { th: "ถูกชะตา", vi: "Đúng định mệnh" }
  source: plernpin-c13#p3
  draft: true
- id: g-c13-thuk-bi
  unit_id: c13
  title_vi: "ถูก mang nghĩa “bị” (câu bị động); โดน"
  pattern: "S + ถูก/โดน + (tác nhân) + động từ"
  explain_vi: "Từ ถูก mang nghĩa “bị”, sử dụng trong câu bị động. Lưu ý 1: โดน được sử dụng y chang như ถูก, nhưng โดน ít phổ biến hơn và thường sử dụng trong văn nói không trang trọng."
  examples:
    - { th: "เขาถูกรถชน", vi: "Anh ấy bị xe đâm" }
    - { th: "เขาโดนตี", vi: "Anh ấy bị đánh" }
  source: plernpin-c13#p4
  draft: true
- id: g-c13-dairap-v
  unit_id: c13
  title_vi: "ได้รับ mang nghĩa “được” (tích cực)"
  pattern: "S + ได้รับ/ถูก + Động từ"
  explain_vi: "Lưu ý 2: ได้รับ được sử dụng thay thế cho ถูก, trong trường hợp mang nghĩa tích cực. Được dịch với nghĩa “Được”."
  examples:
    - { th: "เขาได้รับเชิญไปงานเลี้ยงประจำปี", vi: "Anh ấy được mời đi tiệc đồng niên" }
  source: plernpin-c13#p6
  draft: true
- id: g-c13-dairap-n
  unit_id: c13
  title_vi: "ได้รับ mang nghĩa “được nhận”"
  pattern: "S + ได้รับ + Danh từ"
  explain_vi: "Lưu ý 3: Cấu trúc S + ได้รับ + Danh từ, ได้รับ mang nghĩa “Được nhận”."
  examples:
    - { th: "เขาได้รับทุนการศึกษาจากอเมริกา", vi: "Anh ấy được nhận học bổng từ Mỹ" }
  source: plernpin-c13#p6
  draft: true
- id: g-c12-tai
  unit_id: c12
  title_vi: "Từ ที่ mang nghĩa “ở, tại”"
  pattern: "(อยู่) + ที่ + địa điểm"
  explain_vi: "ที่ đứng trước địa điểm, mang nghĩa “ở, tại”."
  examples:
    - { th: "เขาอยู่ที่บ้าน", vi: "Anh ấy ở tại nhà" }
    - { th: "ที่นี่ที่ไหนคะ", vi: "Ở đây ở đâu ạ?" }
  source: plernpin-c12#p1
  draft: true
- id: g-c12-noi
  unit_id: c12
  title_vi: "Từ ที่ mang nghĩa “nơi, chỗ”"
  pattern: "ที่ + động từ / danh từ"
  explain_vi: "ที่ mang nghĩa “nơi, chỗ”. Các trường hợp của ที่: ที่เขี่ยบุหรี่ (gạt tàn thuốc lá), ที่นั่ง (chỗ ngồi/ghế ngồi), ที่เกิด (nơi sinh), ที่เก็บของ (nơi cất đồ, chỗ cất đồ), ที่จอดรถ (chỗ đậu xe), ที่ตั้ง (vị trí, địa điểm), ที่ทำงาน (chỗ làm việc), ที่เที่ยว (chỗ vui chơi, địa điểm du lịch, địa điểm tham quan), ที่นอน (chỗ nằm, nệm, đệm), ที่ว่าง (chỗ trống, chỗ bỏ không), ที่อยู่ (địa chỉ), ที่นา (đồng ruộng), ที่ประชุม (hội nghị), ที่พัก (chỗ nghỉ ngơi, chỗ lưu trú)."
  examples:
    - { th: "ที่นั่ง", vi: "Chỗ ngồi/ghế ngồi" }
    - { th: "ที่จอดรถ", vi: "Chỗ đậu xe" }
    - { th: "ที่อยู่", vi: "Địa chỉ" }
  source: plernpin-c12#p1
  draft: true
- id: g-c12-suat
  unit_id: c12
  title_vi: "Từ ที่ là loại từ mang nghĩa “phần, suất”"
  pattern: "Danh từ + số + ที่"
  explain_vi: "ที่ là loại từ (ลักษณนาม) mang nghĩa “phần, suất”, dùng khi đếm suất ăn, chỗ ngồi."
  examples:
    - { th: "ข้าวสองที่", vi: "2 suất cơm" }
    - { th: "ที่นั่งสามที่", vi: "3 ghế ngồi/3 chỗ ngồi" }
  source: plernpin-c12#p2
  draft: true
- id: g-c12-din
  unit_id: c12
  title_vi: "Từ ที่ mang nghĩa “đất, đất đai”"
  pattern: "ที่ = ที่ดิน"
  explain_vi: "Từ ที่ là biểu mẫu viết tắt của ที่ดิน, mang nghĩa “đất, đất đai”."
  examples:
    - { th: "เขาซื้อที่ที่ประเทศไทย", vi: "Anh ấy mua đất ở nước Thái" }
  source: plernpin-c12#p3
  draft: true
- id: g-c12-thutu
  unit_id: c12
  title_vi: "Từ ที่ với hàm nghĩa chỉ số thứ tự"
  pattern: "ที่ + số"
  explain_vi: "ที่ đứng trước số, chỉ số thứ tự (thứ …, ngày mùng …)."
  examples:
    - { th: "ฉันนัดหมอวันที่สิบ", vi: "Tôi hẹn gặp bác sĩ ngày mùng 10" }
    - { th: "เขาวิ่งเข้าเส้นชัยเป็นคนที่สาม", vi: "Anh ấy chạy về là người thứ ba" }
  source: plernpin-c12#p3
  draft: true
- id: g-c12-quanhe
  unit_id: c12
  title_vi: "Từ ที่ đóng vai trò là đại từ quan hệ"
  pattern: "Danh từ + ที่ + mệnh đề"
  explain_vi: "ที่ đóng vai trò là đại từ quan hệ, nghĩa là “mà”."
  examples:
    - { th: "คนที่มาชื่อสมชาย", vi: "Người mà đến tên Somchai" }
    - { th: "หนังสือที่ฉันชอบอยู่บนโต๊ะ", vi: "Quyển sách mà tôi thích ở trên bàn" }
  source: plernpin-c12#p3
  draft: true
- id: g-c11-na
  unit_id: c11
  title_vi: "Các trường hợp của น่า"
  pattern: "น่า + động từ / tính từ"
  explain_vi: "น่า đứng trước động từ (hoặc tính từ) tạo nghĩa “đáng …”, “trông …”, “nên …” (đáng để làm việc đó). Ví dụ: น่ากิน (trông ngon, rất đáng để ăn), น่ารัก (đáng yêu, dễ thương), น่าดู (đáng xem, nên xem), น่ากลัว (đáng sợ), น่าเบื่อ (nhàm chán), น่าเสียดาย (đáng tiếc), น่าไว้ใจ (đáng tin cậy)."
  examples:
    - { th: "น่ากิน", vi: "Trông ngon (rất đáng để ăn)" }
    - { th: "น่ารัก", vi: "Đáng yêu, dễ thương" }
    - { th: "น่าดู", vi: "Đáng xem, nên xem" }
    - { th: "น่ากลัว", vi: "Đáng sợ" }
  source: plernpin-c11#p1
  draft: true
- id: g-c11-mai-na
  unit_id: c11
  title_vi: "ไม่น่าเลย và ไม่น่าล่ะ"
  pattern: "ไม่น่า + V + เลย · ไม่น่าล่ะ"
  explain_vi: "ไม่น่าเลย: (đáng lẽ) không nên như vậy chút nào. ไม่น่าล่ะ: thảo nào, hèn chi, bảo sao mà."
  examples:
    - { th: "ไม่น่าเลย", vi: "(Đáng lẽ) không nên như vậy chút nào" }
    - { th: "ไม่น่าล่ะ", vi: "Thảo nào, hèn chi, bảo sao mà" }
  source: plernpin-c11#p2
  draft: true
- id: g-c10-khi-n
  unit_id: c10
  title_vi: "ขี้ + danh từ: phân, chất bẩn, cặn"
  pattern: "ขี้ + danh từ"
  explain_vi: "ขี้ đứng trước danh từ (con vật, bộ phận cơ thể…) chỉ phân, chất bẩn hoặc cặn: ขี้หมู (phân lợn), ขี้หมา (phân chó), ขี้ตา (gỉ mắt), ขี้หู (ráy tai), ขี้เถ้า (tro tàn, tro hỏa táng)."
  examples:
    - { th: "ขี้หมู", vi: "Phân lợn" }
    - { th: "ขี้ตา", vi: "Gỉ mắt" }
    - { th: "ขี้หู", vi: "Ráy tai" }
  source: plernpin-c10#p1
  draft: true
- id: g-c10-khi-tinh
  unit_id: c10
  title_vi: "ขี้ + động từ / tính từ: hay …, dễ …"
  pattern: "ขี้ + động từ / tính từ"
  explain_vi: "ขี้ đứng trước động từ hoặc tính từ tạo tính từ chỉ tính cách, thói quen: “hay …, dễ …” (thường mang nghĩa chê), vd. ขี้อาย (hay xấu hổ), ขี้ลืม (hay quên), ขี้เหนียว (keo kiệt), ขี้หึง (hay ghen), ขี้โมโห (hay nổi nóng)."
  examples:
    - { th: "ขี้อาย", vi: "Hay xấu hổ, hay ngại ngùng" }
    - { th: "ขี้ลืม", vi: "Hay quên, đãng trí" }
    - { th: "ขี้เหนียว", vi: "Keo kiệt, bủn xỉn, hà tiện" }
    - { th: "ขี้หึง", vi: "Hay ghen, dễ ghen" }
  source: plernpin-c10#p1
  draft: true
- id: g-c09-jai-truoc
  unit_id: c09
  title_vi: "ใจ + tính từ: tính cách"
  pattern: "ใจ + tính từ"
  explain_vi: "ใจ (lòng, tâm) đứng trước tính từ tạo từ chỉ tính cách, tâm tính: ใจกว้าง (rộng lượng), ใจแคบ (hẹp hòi), ใจร้อน (nóng tính), ใจเย็น (bình tĩnh), ใจแข็ง (cứng rắn), ใจอ่อน (dễ mềm lòng), ใจดำ = ใจร้าย (độc ác), ใจดี (tốt bụng), ใจลอย (lơ đễnh)."
  examples:
    - { th: "ใจกว้าง", vi: "Rộng rãi, hào phóng, rộng lượng" }
    - { th: "ใจเย็น", vi: "Bình tĩnh" }
    - { th: "ใจดี", vi: "Tốt bụng" }
  source: plernpin-c09#p1
  draft: true
- id: g-c09-jai-sau
  unit_id: c09
  title_vi: "Động từ / tính từ + ใจ: cảm xúc, trạng thái"
  pattern: "động từ / tính từ + ใจ"
  explain_vi: "ใจ đứng sau động từ hoặc tính từ tạo từ chỉ cảm xúc, trạng thái của lòng: เบาใจ (yên tâm), สบายใจ (thoải mái trong lòng), ภูมิใจ (tự hào), พอใจ (hài lòng), ตกใจ (giật mình), เสียใจ (buồn), ตัดสินใจ (quyết định), ตั้งใจ (tập trung), เปลี่ยนใจ (đổi ý), ไว้ใจ (tin tưởng)…"
  examples:
    - { th: "สบายใจ", vi: "Thoải mái trong lòng" }
    - { th: "ภูมิใจ", vi: "Tự hào, hãnh diện" }
    - { th: "ตัดสินใจ", vi: "Quyết định, đưa ra quyết định" }
  source: plernpin-c09#p1
  draft: true
- id: g-c07-vu-an
  unit_id: c07
  title_vi: "ความ đứng một mình: vụ án, vụ kiện, vụ việc"
  pattern: "ความ (đứng một mình)"
  explain_vi: "“ความ” đứng một mình với ý nghĩa “vụ án, vụ kiện, vụ việc”."
  examples:
    - { th: "ความแตกเมื่อนักข่าวตามไปเห็น", vi: "Vụ việc vỡ nở khi nhà báo theo đi bắt gặp được" }
    - { th: "ทนายว่าความในศาล", vi: "Luật sư nói vụ án trong tòa án" }
    - { th: "สู้ความ", vi: "Tranh kiện" }
    - { th: "ชนะความ", vi: "Thắng kiện" }
  source: plernpin-c07#p1
  draft: true
- id: g-c07-noi-dung
  unit_id: c07
  title_vi: "ความ đứng một mình: nội dung, thông tin"
  pattern: "động từ + ความ"
  explain_vi: "“ความ” đứng một mình còn mang ý nghĩa “nội dung, thông tin”."
  examples:
    - { th: "จำกัดความ", vi: "Định nghĩa" }
    - { th: "ย่อความ", vi: "Tóm tắt nội dung" }
  source: plernpin-c07#p1
  draft: true
- id: g-c07-dong-tu
  unit_id: c07
  title_vi: "ความ + động từ chỉ tình cảm/tình trạng = danh từ"
  pattern: "ความ + Động từ chỉ tình cảm/tình trạng = Danh từ"
  explain_vi: "“ความ” được sử dụng để thêm vào trước động từ của hoạt động trừu tượng hoặc động từ liên quan đến tâm lý để thành lập danh từ. Lưu ý: Trong 1 số trường hợp การ và ความ đều có thể đứng trước cùng một động từ, nhưng ý nghĩa lại hoàn toàn khác nhau. “การ” thường thể hiện quá trình trong việc thực hiện hành động. Còn “ความ” thể hiện tình trạng của động từ. Khi “การ” đứng trước động từ thường trở thành danh từ cụ thể, còn “ความ” đứng trước động từ lại trở thành danh từ trừu tượng."
  examples:
    - { th: "ความรัก", vi: "Tình yêu" }
    - { th: "ความคิดถึง", vi: "Nỗi nhớ" }
    - { th: "ความรักเป็นสิ่งสวยงาม แต่การรักใครสักคนไม่ใช่เรื่องง่าย", vi: "Tình yêu là thứ đẹp đẽ nhưng việc yêu một ai đó không phải là chuyện dễ dàng" }
  source: plernpin-c07#p1
  draft: true
- id: g-c07-tinh-tu
  unit_id: c07
  title_vi: "ความ + tính từ = danh từ (chỉ tính chất, đặc điểm)"
  pattern: "ความ + Tính từ = Danh từ (chỉ tính chất, đặc điểm)"
  explain_vi: "“ความ” được sử dụng để thêm vào trước tính từ để thành lập danh từ chỉ tính chất, đặc điểm."
  examples:
    - { th: "ความสูง", vi: "Chiều cao" }
    - { th: "ความจริง", vi: "Sự thật" }
    - { th: "ความสุข", vi: "Hạnh phúc" }
  source: plernpin-c07#p2
  draft: true
- id: g-c07-danh-tu
  unit_id: c07
  title_vi: "ความ + danh từ: từ với nghĩa khác"
  pattern: "ความ + danh từ"
  explain_vi: "“ความ” còn đứng trước danh từ làm tiền tố để dẫn xuất danh từ đó thành một từ với nghĩa khác. Trường hợp này không được xếp vào nhóm “Biến đổi từ động từ, tính từ thành danh từ bằng cách thêm tiền tố ความ”."
  examples:
    - { th: "ความเมือง", vi: "Việc chính trị (những vấn đề liên quan đến quốc gia)" }
    - { th: "ความแพ่ง", vi: "Dân sự" }
    - { th: "ความอาญา", vi: "Hình sự" }
  source: plernpin-c07#p5
  draft: true
- id: g-c07-phu-dinh
  unit_id: c07
  title_vi: "ความ đứng trước yếu tố phủ định"
  pattern: "ความ + ไม่ + tính từ / động từ"
  explain_vi: "“ความ” còn đứng trước yếu tố phủ định."
  examples:
    - { th: "ความไม่จริง", vi: "Không đúng sự thật" }
    - { th: "ความไม่สะอาด", vi: "Sự bẩn thỉu, sự nhơ nhuốc, sự không sạch sẽ" }
  source: plernpin-c07#p5
  draft: true
- id: g-c06-hanh-dong
  unit_id: c06
  title_vi: "การ + động từ chỉ hành động = danh từ"
  pattern: "การ + Động từ chỉ hành động = Danh từ"
  explain_vi: "การ được dùng để thêm vào trước động từ để tạo thành danh từ. Động từ ở đây phải thể hiện hoạt động cụ thể của cơ thể, lời nói hoặc động từ thể hiện tình trạng, tình cảm."
  examples:
    - { th: "การกิน", vi: "Việc ăn" }
    - { th: "การนอน", vi: "Việc ngủ" }
    - { th: "การเดินทาง", vi: "Việc đi lại, chuyến đi" }
  source: plernpin-c06#p1
  draft: true
- id: g-c06-tinh-cam
  unit_id: c06
  title_vi: "การ + động từ chỉ tình trạng, tình cảm = danh từ"
  pattern: "การ + Động từ chỉ tình trạng, tình cảm = Danh từ"
  explain_vi: "การ đứng trước động từ chỉ tình trạng, tình cảm cũng tạo thành danh từ (việc …)."
  examples:
    - { th: "การรัก", vi: "Việc yêu (một ai đó)" }
    - { th: "การรู้", vi: "Việc biết (một điều gì)" }
    - { th: "การพยายาม", vi: "Việc cố gắng (việc nỗ lực làm một cái gì đó)" }
  source: plernpin-c06#p1
  draft: true
- id: g-c06-mot-minh
  unit_id: c06
  title_vi: "การ đứng một mình: việc, chuyện, vấn đề"
  pattern: "การ (đứng một mình)"
  explain_vi: "การ đứng một mình với nghĩa là “Việc/chuyện/vấn đề”."
  examples:
    - { th: "ในการนี้", vi: "Trong chuyện này, trong vấn đề này" }
    - { th: "เป็นการยาก", vi: "Là việc khó, là vấn đề khó" }
    - { th: "การนี้ต้องทำให้สำเร็จ", vi: "Việc này phải làm cho thành công" }
  source: plernpin-c06#p3
  draft: true
- id: g-c06-hau-to
  unit_id: c06
  title_vi: "การ làm hậu tố trong từ gốc Phạn"
  pattern: "… + การ"
  explain_vi: "การ còn được sử dụng như thành phần hậu tố trong việc pha trộn ngôn ngữ gốc phạn."
  examples:
    - { th: "กรรมการ", vi: "Hội đồng, ban giám khảo (chấm thi)/ủy viên, thành viên trong ban quản trị (ban tổ chức, ban quản lý)" }
    - { th: "กิจการ", vi: "Công việc kinh doanh, doanh nghiệp, cơ sở làm ăn" }
    - { th: "โครงการ", vi: "Dự án, đề án" }
  source: plernpin-c06#p4
  draft: true
- id: g-c06-danh-tu
  unit_id: c06
  title_vi: "การ + danh từ: từ với nghĩa hoàn toàn khác"
  pattern: "การ + danh từ"
  explain_vi: "การ còn đứng trước danh từ làm tiền tố để dẫn xuất danh từ đó thành một từ với nghĩa hoàn toàn khác. Trường hợp này không được xếp vào nhóm “biến đổi từ động từ thành danh từ bằng cách thêm tiền tố การ”."
  examples:
    - { th: "การบ้าน", vi: "Bài tập về nhà" }
    - { th: "การเมือง", vi: "Chính trị" }
    - { th: "การศึกษา", vi: "Giáo dục, nền giáo dục" }
    - { th: "การเงิน", vi: "Tài chính" }
  source: plernpin-c06#p4
  draft: true
- id: g-c05-bo1
  unit_id: c05
  title_vi: "Đại từ chỉ định bộ 1: นี่ < นั่น < โน่น < นู่น"
  pattern: "นี่ (đây) < นั่น (đó) < โน่น (kia) < นู่น (kia kìa)"
  explain_vi: "Đại từ chỉ định là đại từ dùng để chỉ khoảng cách xa gần. Đại từ chỉ định trong tiếng Thái gồm có 8 từ và chia ra làm 2 bộ. Cách sử dụng của bộ 1: a. dùng theo sau động từ; b. dùng bắt đầu câu và đứng trước động từ; c. bắt đầu câu và đứng trước danh từ; d. đứng sau danh từ; e. được nói với giọng hạ thấp, được dùng làm đại từ."
  examples:
    - { th: "นั่งนี่ไหม", vi: "Ngồi đây không?" }
    - { th: "นี่คืออะไร", vi: "Đây là cái gì?" }
  source: plernpin-c05#p1
  draft: true
- id: g-c05-bo2
  unit_id: c05
  title_vi: "Đại từ chỉ định bộ 2: นี้ < นั้น < โน้น < นู้น"
  pattern: "นี้ (này) < นั้น (đấy) < โน้น (kìa) < นู้น (kia kìa)"
  explain_vi: "Giữa bộ 2 và bộ 1, thì mức độ của bộ 2 sẽ xa hơn so với bộ 1. Cách sử dụng của bộ 2: a. luôn được sử dụng theo sau giới từ; b. đứng sau danh từ; c. đứng sau loại từ."
  examples:
    - { th: "อะไรอยู่ในนี้", vi: "Cái gì ở trong này?" }
    - { th: "เสื้อตัวนี้ราคาถูกมาก", vi: "Chiếc áo này giá rẻ lắm" }
  source: plernpin-c05#p1
  draft: true
- id: g-c05-lao
  unit_id: c05
  title_vi: "เหล่า + นี้/นั้น: số nhiều"
  pattern: "(danh từ) + เหล่า + นี้ / นั้น"
  explain_vi: "Thêm เหล่า vào trước để tạo thành số nhiều và phát âm với thanh điệu cao."
  examples:
    - { th: "ไก่เหล่านี้", vi: "Các con gà này" }
  source: plernpin-c05#p4
  draft: true
- id: g-c05-thanh-ngu
  unit_id: c05
  title_vi: "Một số trường hợp khác của đại từ chỉ định"
  pattern: "นี่ยังไง · นั่นนะสิ · แต่นั่นแหละ"
  explain_vi: "Đại từ chỉ định còn xảy ra trong một số trường hợp sau: นี่ยังไง (đây này, đây nè, đây chứ gì), นั่นนะสิ (chính xác, chuẩn rồi), แต่นั่นแหละ (nhưng mà đó)."
  examples:
    - { th: "นี่ยังไง", vi: "Đây này, đây nè, đây chứ gì" }
    - { th: "นั่นนะสิ", vi: "Chính xác, chuẩn rồi" }
    - { th: "แต่นั่นแหละ", vi: "Nhưng mà đó" }
  source: plernpin-c05#p4
  draft: true
- id: g-c05-khong
  unit_id: c05
  title_vi: "Đại từ sở hữu ของ"
  pattern: "danh từ + ของ + người sở hữu"
  explain_vi: "Từ ของ được dùng để chỉ sở hữu. Lưu ý: ของ cũng có thể được dùng như danh từ, mang nghĩa “món, thứ, đồ”."
  examples:
    - { th: "กระเป๋าของฉัน", vi: "Túi của tôi" }
    - { th: "เขาไปซื้อของแล้ว", vi: "Anh ấy đi mua đồ rồi" }
  source: plernpin-c05#p4
  draft: true
- id: g-c05-eng
  unit_id: c05
  title_vi: "Đại từ nhấn mạnh เอง"
  pattern: "S + เอง + V · S + V + เอง · S + เอง + เป็นคน + V · ตัว + S + เอง + V · đại từ chỉ định + เอง"
  explain_vi: "Đại từ nhấn mạnh “เอง” mang nghĩa “tự, chính”, nó xảy ra trong các mẫu sau, mỗi mẫu truyền tải một mức độ nhấn mạnh hơi khác nhau. เอง còn được xảy ra sau đại từ chỉ định."
  examples:
    - { th: "ผมเองทำ", vi: "Tôi tự làm" }
    - { th: "ผมทำเอง", vi: "Tôi tự làm, chính tôi làm" }
    - { th: "ผมเองเป็นคนทำ", vi: "Tôi chính là người làm" }
    - { th: "ตัวผมเองทำ", vi: "Bản thân tôi tự làm" }
    - { th: "เพื่อนคนนี้เอง", vi: "Chính người bạn này" }
    - { th: "วันนั้นเอง", vi: "Chính ngày hôm đó" }
    - { th: "เดี๋ยวนี้เอง", vi: "Ngay bây giờ, ngay lúc này thôi" }
    - { th: "สามร้อยบาทเท่านั้นเอง", vi: "Chỉ 300 bạt mà thôi" }
  source: plernpin-c05#p5
  draft: true
- id: g-c03-clf
  unit_id: c03
  title_vi: "Loại từ (ลักษณนาม): danh từ + số + loại từ"
  pattern: "Danh từ + số + loại từ"
  explain_vi: "Khi đếm, tiếng Thái đặt loại từ (ลักษณนาม) sau số: danh từ + số + loại từ. Mỗi danh từ đi với một loại từ riêng; người (เกี่ยวกับคน) dùng คน, con vật (สัตว์) dùng ตัว."
  examples:
    - { th: "ตุ๊กตาสองตัว", vi: "2 con búp bê" }
    - { th: "รองเท้าหนึ่งคู่", vi: "1 đôi giày" }
    - { th: "หนังสือสามเล่ม", vi: "3 quyển sách" }
  source: plernpin-c03#p1
  draft: true
- id: g-c02-mai
  unit_id: c02
  title_vi: "ไหม/มั้ย: Không?"
  pattern: "Câu + ไหม/มั้ย"
  explain_vi: "ไหม/มั้ย đứng cuối câu để hỏi “… không?”. Lưu ý 1: ม่ะ/มะ là cách nói ngắn gọn, thân mật của ไหม, dùng khi chát chít với nhau, thể hiện sự thân mật khi giao tiếp: ชอบมะ (Thích không?) dùng trong văn nói, xuồng xã hơn, dùng với bạn bè, người thân; ชอบม่ะ (Thích không?) dùng trong văn nói có chút ngọt ngào, xuất hiện nhiều trong tin nhắn, chat. Lưu ý 2: หรือไม่/หรือเปล่า/รึเปล่า/ป่าว/ป่ะ đôi khi được dùng thay thế cho ไหม/มั้ย."
  examples:
    - { th: "ชอบมะ", vi: "Thích không?" }
    - { th: "ชอบม่ะ", vi: "Thích không?" }
    - { th: "อยากกินข้าวเหนียวมะม่วงหรือเปล่าคะ", vi: "Muốn ăn xôi xoài không ạ?" }
    - { th: "อร่อยป่ะ", vi: "Ngon không?" }
    - { th: "ชอบรึเปล่า", vi: "Thích không?" }
  source: plernpin-c02#p1
  draft: true
- id: g-c02-chai-mai
  unit_id: c02
  title_vi: "ใช่ไหม: Phải không?"
  pattern: "Câu + ใช่ไหม"
  explain_vi: "ใช่ไหม: Phải không? => Dự đoán được câu trả lời rồi nhưng cần sự khẳng định của người nghe. Lưu ý: Bạn có thể sử dụng ใช่ป่ะ/ใช่ป่าว để thay thế ใช่ไหม."
  examples:
    - { th: "คุณเป็นนักศึกษาใช่ไหม", vi: "Bạn là sinh viên phải không?" }
  source: plernpin-c02#p2
  draft: true
- id: g-c02-boi-mai
  unit_id: c02
  title_vi: "บ่อยไหม: Thường xuyên không?"
  pattern: "Câu + บ่อยไหม"
  explain_vi: "บ่อยไหม đứng cuối câu để hỏi “… thường xuyên không?”."
  examples:
    - { th: "คุณดูทีวีบ่อยไหม", vi: "Bạn xem tivi thường xuyên không?" }
  source: plernpin-c02#p2
  draft: true
- id: g-c02-rue
  unit_id: c02
  title_vi: "หรือ: Chứ, à? · Hay/hoặc (câu hỏi lựa chọn)"
  pattern: "Câu + หรือ · A + หรือ + B"
  explain_vi: "หรือ cuối câu: chứ, à? Lưu ý: หรือ: Hay/hoặc (câu hỏi lựa chọn)."
  examples:
    - { th: "จริงหรือ", vi: "Thật à?" }
    - { th: "คุณจะไปกับเขาหรือจะไปกับฉัน", vi: "Bạn định đi với anh ấy hay sẽ đi với tôi" }
  source: plernpin-c02#p3
  draft: true
- id: g-c02-rue-yang
  unit_id: c02
  title_vi: "แล้วหรือยัง/หรือยัง/ยัง: Chưa?"
  pattern: "Câu + แล้วหรือยัง / หรือยัง / ยัง"
  explain_vi: "แล้วหรือยัง/หรือยัง/ยัง: Chưa? => Để hỏi điều gì đó đã xảy ra hay chưa?"
  examples:
    - { th: "คุณแต่งงานแล้วหรือยัง", vi: "Bạn kết hôn chưa?" }
  source: plernpin-c02#p4
  draft: true
- id: g-c02-khoei
  unit_id: c02
  title_vi: "เคย….หรือยัง/เคย….ไหม: Đã từng….chưa?"
  pattern: "เคย + V + หรือยัง / ไหม"
  explain_vi: "เคย….หรือยัง/เคย….ไหม: Đã từng….chưa?"
  examples:
    - { th: "คุณเคยไปเมืองไทยหรือยัง", vi: "Bạn đã từng đi Thái chưa?" }
  source: plernpin-c02#p4
  draft: true
- id: g-c02-khrai
  unit_id: c02
  title_vi: "ใคร: Ai?"
  pattern: "… ใคร …"
  explain_vi: "ใคร: Ai? Lưu ý: ใคร còn giống như một đại từ không xác định => Mẫu câu không cần câu trả lời (ai đó, không ai)."
  examples:
    - { th: "คุณอยู่กับใคร", vi: "Bạn ở với ai?" }
    - { th: "ไม่มีใครรู้", vi: "Không có ai biết" }
  source: plernpin-c02#p4
  draft: true
- id: g-c02-arai
  unit_id: c02
  title_vi: "อะไร: Cái gì?"
  pattern: "… อะไร …"
  explain_vi: "อะไร: Cái gì? Lưu ý: อะไร còn giống như một đại từ không xác định => Mẫu câu không cần câu trả lời (gì cũng…, không có gì)."
  examples:
    - { th: "อะไรอยู่ในตู้", vi: "Cái gì ở trong tủ" }
    - { th: "คุณอยากกินอะไรก็ได้", vi: "Bạn muốn ăn gì cũng được" }
  source: plernpin-c02#p6
  draft: true
- id: g-c02-thinai
  unit_id: c02
  title_vi: "ที่ไหน/ไหน: Ở đâu?, chỗ nào?/Đâu?"
  pattern: "… ที่ไหน / ไหน"
  explain_vi: "ที่ไหน/ไหน: Ở đâu?, chỗ nào?/Đâu? Lưu ý: ที่ไหน còn giống như một đại từ không xác định => Mẫu câu không cần câu trả lời."
  examples:
    - { th: "บ้านของคุณอยู่ที่ไหน", vi: "Nhà của bạn ở đâu?" }
    - { th: "อยู่ที่ไหนก็ไม่สะดวกเท่าอยู่บ้าน", vi: "Ở đâu cũng không tiện bằng ở nhà" }
  source: plernpin-c02#p7
  draft: true
- id: g-c02-muearai
  unit_id: c02
  title_vi: "เมื่อไหร่/เมื่อไร/เมื่อใด: Khi nào? Bao giờ?"
  pattern: "… เมื่อไหร่ / เมื่อไร / เมื่อใด"
  explain_vi: "เมื่อไหร่/เมื่อไร/เมื่อใด: Khi nào? Bao giờ? Lưu ý: เมื่อไหร่/เมื่อไร/เมื่อใด còn giống như một đại từ không xác định => Mẫu câu không cần câu trả lời."
  examples:
    - { th: "เครื่องบินจะลงจอดเมื่อไหร่", vi: "Máy bay sẽ hạ cánh khi nào?" }
    - { th: "เธอจะมาเมื่อไหร่ก็ได้", vi: "Cô ấy định đến lúc nào cũng được" }
  source: plernpin-c02#p8
  draft: true
- id: g-c02-thaorai
  unit_id: c02
  title_vi: "เท่าไหร่/เท่าไร: Bao nhiêu?"
  pattern: "… เท่าไหร่ / เท่าไร"
  explain_vi: "เท่าไหร่/เท่าไร: Bao nhiêu? Lưu ý: เท่าไหร่/เท่าไร còn giống như một đại từ không xác định => Mẫu câu không cần câu trả lời."
  examples:
    - { th: "วันนี้วันที่เท่าไหร่", vi: "Ngày hôm nay là ngày bao nhiêu?" }
  source: plernpin-c02#p9
  draft: true
- id: g-c02-yangrai
  unit_id: c02
  title_vi: "อย่างไร, ยังไง, เป็นยังไง, เป็นยังไงบ้าง/ทำไฉน: Như thế nào? Bằng cách nào?/Làm sao, làm thế nào?"
  pattern: "… อย่างไร / ยังไง / เป็นยังไง(บ้าง)"
  explain_vi: "อย่างไร, ยังไง, เป็นยังไง, เป็นยังไงบ้าง/ทำไฉน: Như thế nào? Bằng cách nào?/Làm sao, làm thế nào? Lưu ý: còn giống như một đại từ không xác định => Mẫu câu không cần câu trả lời."
  examples:
    - { th: "คุณมาเรียนยังไง", vi: "Bạn đến học bằng cách nào?" }
    - { th: "วันนี้คุณเป็นยังไงบ้าง", vi: "Ngày hôm nay bạn như thế nào?" }
  source: plernpin-c02#p9
  draft: true
- id: g-c02-ki
  unit_id: c02
  title_vi: "กี่: Mấy?"
  pattern: "กี่ + loại từ / đơn vị"
  explain_vi: "กี่: Mấy? Lưu ý: กี่ còn giống như một đại từ không xác định => Mẫu câu không cần câu trả lời."
  examples:
    - { th: "คุณพูดได้กี่ภาษา", vi: "Bạn nói được mấy ngôn ngữ?" }
  source: plernpin-c02#p10
  draft: true
